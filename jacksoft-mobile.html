<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JackSoft App — Cliente &amp; Domiciliario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange-700:#C2410C; --orange-600:#EA580C; --orange-500:#F1793D; --orange-100:#FDEAD9; --orange-50:#FEF5EC;
  --gold-600:#C6890A; --gold-100:#FBF0D8;
  --green-600:#3E8A63; --green-100:#E7F3EC;
  --red-600:#C0392B; --red-100:#FBE7E4;
  --blue-600:#2F5F8A; --blue-100:#E1EAF3;
  --ink-900:#241C16; --ink-700:#57493E; --ink-500:#8C7B6C; --ink-300:#CBBEAE;
  --line:#EFE4D6; --line-soft:#F7F0E6; --bg:#FAF7F2; --card:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(90,60,20,.07); --shadow-md:0 14px 30px rgba(90,60,20,.16);
  --mono:'JetBrains Mono',monospace; --display:'Manrope',sans-serif; --body:'Inter',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--body);color:var(--ink-900);background:#EDE3D3;min-height:100vh;}
h1,h2,h3,h4{font-family:var(--display);margin:0;}
p{margin:0;}
button{font-family:var(--body);cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------------- Device shell ---------------- */
#device-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 16px;background:
  radial-gradient(circle at 20% 15%,#F6ECDC,transparent 45%),
  radial-gradient(circle at 85% 80%,#F0E2C8,transparent 40%),#EAE0CE;}
.phone{width:390px;height:844px;background:#111;border-radius:46px;padding:12px;box-shadow:var(--shadow-md),0 0 0 2px rgba(0,0,0,.05);position:relative;flex-shrink:0;}
.screen{background:var(--bg);width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#111;border-radius:14px;z-index:50;}
.status-bar{height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink-900);background:var(--bg);position:relative;z-index:5;}
.status-icons{display:flex;align-items:center;gap:5px;}

/* ---------------- App bar ---------------- */
.app-topbar{padding:6px 20px 14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg);}
.topbar-back{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-700);flex-shrink:0;}
.topbar-title{flex:1;}
.topbar-title h2{font-size:17px;}
.topbar-title .sub{font-size:11.3px;color:var(--ink-500);margin-top:1px;}
.topbar-bell{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-700);position:relative;flex-shrink:0;}
.tb-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--orange-600);border-radius:50%;border:1.5px solid #fff;}

/* ---------------- Content ---------------- */
.app-content{flex:1;overflow-y:auto;padding:2px 20px 110px 20px;position:relative;}
.hero-greet{background:linear-gradient(120deg,var(--orange-600),var(--orange-500));border-radius:20px;padding:20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;}
.hero-greet .hero-bg-icon{position:absolute;right:-12px;bottom:-16px;opacity:.2;color:#fff;pointer-events:none;}
.hero-greet h3{color:#fff;font-size:17px;position:relative;z-index:1;max-width:220px;}
.hero-greet p{color:rgba(255,255,255,.9);font-size:12px;margin-top:6px;position:relative;z-index:1;max-width:220px;}

.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px;}
.card-row{display:flex;align-items:center;gap:12px;}
.ic-tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;}
.stat-card .lbl{font-size:10.6px;color:var(--ink-500);font-weight:600;}
.stat-card .val{font-family:var(--mono);font-weight:700;font-size:17px;margin-top:4px;}

.section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-300);font-family:var(--mono);font-weight:600;margin:18px 0 10px 2px;}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-soft);}
.list-item:last-child{border-bottom:none;}
.li-title{font-size:13.4px;font-weight:700;color:var(--ink-900);}
.li-sub{font-size:11.6px;color:var(--ink-500);margin-top:2px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.6px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.badge::before{content:"";width:5.5px;height:5.5px;border-radius:50%;}
.badge-ok{background:var(--green-100);color:var(--green-600);}.badge-ok::before{background:var(--green-600);}
.badge-warn{background:var(--gold-100);color:var(--gold-600);}.badge-warn::before{background:var(--gold-600);}
.badge-off{background:#F0EBE3;color:var(--ink-500);}.badge-off::before{background:var(--ink-300);}
.badge-bad{background:var(--red-100);color:var(--red-600);}.badge-bad::before{background:var(--red-600);}
.badge-info{background:var(--blue-100);color:var(--blue-600);}.badge-info::before{background:var(--blue-600);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;font-size:13.4px;font-weight:700;padding:12px 16px;width:100%;}
.btn-primary{background:var(--orange-600);color:#fff;box-shadow:0 8px 16px rgba(234,88,12,.25);}
.btn-ghost{background:#fff;color:var(--ink-900);border:1.5px solid var(--line);}
.btn-danger{background:var(--red-100);color:var(--red-600);}
.btn-sm{padding:9px 12px;font-size:12px;width:auto;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11.6px;font-weight:700;color:var(--ink-700);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;height:44px;padding:0 13px;font-size:13.6px;outline:none;color:var(--ink-900);background:#fff;font-family:var(--body);}
.field textarea{height:80px;padding:10px 13px;resize:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange-500);box-shadow:0 0 0 3px var(--orange-100);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-500);}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.switch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;}
.switch-row .t{font-size:13px;font-weight:600;}
.switch{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s;}
.switch.on{background:var(--orange-600);}
.switch .thumb{position:absolute;top:2.5px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s;}
.switch.on .thumb{left:20px;}

.radio2{display:flex;gap:8px;}
.radio2 .opt{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:12.4px;font-weight:700;text-align:center;color:var(--ink-700);}
.radio2 .opt.sel{border-color:var(--orange-500);background:var(--orange-50);color:var(--orange-700);}

.chip-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.3px;font-weight:600;padding:5px 10px;border-radius:16px;background:var(--orange-50);color:var(--orange-700);margin:2px 4px 2px 0;}
.chip-tag button{color:inherit;font-size:11px;}
.chip-add{display:inline-flex;align-items:center;gap:5px;font-size:11.3px;font-weight:700;padding:5px 10px;border-radius:16px;background:#fff;border:1.5px dashed var(--line);color:var(--ink-500);}

/* timeline (vertical, mobile) */
.vtimeline{position:relative;padding-left:6px;}
.vt-step{display:flex;gap:14px;position:relative;padding-bottom:22px;}
.vt-step:last-child{padding-bottom:0;}
.vt-line{position:absolute;left:15px;top:32px;bottom:0;width:2.5px;background:var(--line);}
.vt-step:last-child .vt-line{display:none;}
.vt-step.done .vt-line{background:var(--orange-600);}
.vt-dot{width:32px;height:32px;border-radius:50%;background:#fff;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-300);flex-shrink:0;z-index:1;}
.vt-step.done .vt-dot{border-color:var(--orange-600);background:var(--orange-600);color:#fff;}
.vt-step.current .vt-dot{border-color:var(--orange-600);color:var(--orange-600);box-shadow:0 0 0 4px var(--orange-100);}
.vt-body .t{font-size:13.4px;font-weight:700;}
.vt-body .s{font-size:11.4px;color:var(--ink-500);margin-top:2px;}

/* calendar */
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.mcal-dow{font-size:9.5px;color:var(--ink-300);text-align:center;font-family:var(--mono);}
.mcal-cell{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-700);background:#fff;border:1.5px solid var(--line-soft);}
.mcal-cell.off{border-color:transparent;color:var(--ink-300);}
.mcal-cell.sel{background:var(--orange-600);border-color:var(--orange-600);color:#fff;}

/* map mock */
.map-mock{position:relative;height:230px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#F5EEE2,#FBF3E7);border:1px solid var(--line);}
.map-mock.tall{height:340px;}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(194,65,12,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(194,65,12,.05) 1px,transparent 1px);background-size:24px 24px;}
.map-route-line{position:absolute;height:3px;background:var(--orange-500);border-radius:3px;}
.map-pin{position:absolute;width:15px;height:15px;border-radius:50% 50% 50% 0;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.map-eta{position:absolute;top:10px;left:10px;right:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);font-size:11.6px;display:flex;justify-content:space-between;align-items:center;}

/* bottom nav */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:14px;z-index:20;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-300);}
.bn-item .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px;}
.bn-item.active{color:var(--orange-600);}
.bn-item.active .dot{background:var(--orange-600);}
.bn-item span{font-size:9.8px;font-weight:700;}

/* FAB */
.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:linear-gradient(150deg,var(--orange-500),var(--orange-700));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(194,65,12,.35);z-index:15;}

/* snackbar */
.snackbar-wrap{position:absolute;left:16px;right:16px;bottom:92px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.snackbar{background:var(--ink-900);color:#fff;padding:12px 14px;border-radius:13px;font-size:12.4px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-md);animation:snackin .18s ease;}
@keyframes snackin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* bottom sheet */
.sheet-backdrop{position:absolute;inset:0;background:rgba(36,28,22,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s ease;}
.sheet-backdrop.open{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:71;transform:translateY(100%);transition:transform .22s ease;max-height:80%;overflow-y:auto;padding:10px 20px 26px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.15);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px auto;}

/* auth screens */
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 8px 0;}
.auth-logo .mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,var(--orange-500),var(--orange-700));display:flex;align-items:center;justify-content:center;font-size:28px;}
.auth-logo .name{font-family:var(--display);font-weight:800;font-size:16px;}
.auth-logo .sub{font-size:10.8px;color:var(--ink-500);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
.demo-role-picker{display:flex;gap:8px;background:var(--orange-50);border-radius:14px;padding:8px;margin:14px 0 18px 0;}
.demo-role-picker button{flex:1;padding:9px 0;border-radius:10px;font-size:11.8px;font-weight:700;color:var(--orange-700);}
.demo-role-picker button.sel{background:#fff;box-shadow:var(--shadow-sm);}
.demo-note{font-size:10.2px;color:var(--ink-500);text-align:center;margin-bottom:10px;font-family:var(--mono);}

/* splash */
.splash-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--orange-700),var(--orange-500) 130%);position:relative;overflow:hidden;}
.splash-glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);top:-80px;right:-80px;}
.splash-mark{width:90px;height:90px;border-radius:26px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;z-index:1;}
.splash-name{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;margin-top:18px;position:relative;z-index:1;}
.splash-sub{font-size:11.5px;color:rgba(255,255,255,.85);font-family:var(--mono);margin-top:4px;position:relative;z-index:1;letter-spacing:.4px;}
.splash-dots{display:flex;gap:6px;margin-top:34px;position:relative;z-index:1;}
.splash-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);animation:pulse 1.1s infinite ease-in-out;}
.splash-dots span:nth-child(2){animation-delay:.15s;}
.splash-dots span:nth-child(3){animation-delay:.3s;}
@keyframes pulse{0%,80%,100%{opacity:.35;transform:scale(.8);}40%{opacity:1;transform:scale(1.15);}}

.role-strip{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:99;background:#241C16;color:#fff;padding:8px 16px;border-radius:20px;font-family:var(--mono);font-size:11px;letter-spacing:.4px;display:flex;gap:10px;align-items:center;}
.role-strip b{color:var(--orange-500);}
.role-strip button{color:#fff;opacity:.7;font-size:10.5px;text-decoration:underline;}
</style>
</head>
<body>
<div id="device-shell"><div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div></div>

<script>
/* ============================= ICONS ============================= */
function ic(name,size,sw){
  size=size||18;sw=sw||1.8;
  const s='width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"';
  const map={
    home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/>',
    doc:'<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>',
    truck:'<rect x="2.5" y="7" width="12" height="9" rx="1"/><path d="M14.5 10h3.7L21 13.2V16h-6.5z"/><circle cx="7" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/>',
    alert:'<path d="M12 3.5 21.5 20h-19z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
    user:'<circle cx="12" cy="8.2" r="3.6"/><path d="M4.5 20c0-3.6 3.3-6 7.5-6s7.5 2.4 7.5 6"/>',
    route:'<circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M6 8.4V13a4 4 0 0 0 4 4h4"/>',
    box:'<path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/>',
    history:'<path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M2.5 4v4h4"/><path d="M12 8v4l3 2"/>',
    bell:'<path d="M6 10a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    back:'<path d="M15 5 8 12l7 7"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/>',
    eyeOff:'<path d="M3 3l18 18"/><path d="M10.6 5.6A10.6 10.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a13.3 13.3 0 0 1-3 3.7M6.6 6.6C4 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.3 0 2.5-.2 3.6-.6"/><path d="M9.9 10a2.6 2.6 0 0 0 3.6 3.6"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',
    x:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
    check2:'<circle cx="12" cy="12" r="10"/><path d="M8 12.3l2.8 2.8L16.3 9"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    phone:'<path d="M6.5 3h3l1.5 4-2 2c.9 2 2.6 3.7 4.6 4.6l2-2 4 1.5v3a2 2 0 0 1-2.2 2C10.8 17.6 6.4 13.2 5.5 6.2 5.4 4.4 5.4 3 6.5 3Z"/>',
    mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/>',
    pin:'<path d="M12 21s-7-6.4-7-11.5A7 7 0 0 1 19 9.5C19 14.6 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/>',
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>',
    calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    camera:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.6-2.5h4.8L16 7"/><circle cx="12" cy="13.5" r="3.4"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    nav:'<path d="M3 11l17-8-8 17-2-7-7-2Z"/>',
    bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 9 9h5l3 8"/><path d="M9 9h5"/><circle cx="16" cy="6" r="1.4"/>',
    coin:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2c0-1 1-1.7 2.5-1.7s2.5.6 2.5 1.6c0 2.2-5 1.8-5 4 0 1 1 1.7 2.5 1.7s2.5-.6 2.5-1.6"/><path d="M12 6v2M12 16v2"/>',
    star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z"/>',
    logout:'<path d="M9 20H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/><path d="M16 16l4-4-4-4"/><path d="M20 12H9"/>',
    plate:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
    car:'<rect x="2.5" y="7" width="12" height="9" rx="1"/>',
    edit:'<path d="M4 20l.9-3.6L16 5.3a1.5 1.5 0 0 1 2.1 0l.6.6a1.5 1.5 0 0 1 0 2.1L7.6 19.1z"/><path d="M14 7l3 3"/>',
    gauge:'<circle cx="12" cy="13" r="8"/><path d="M12 13l4-4"/><path d="M9 5.5 12 5M15 5.5 12 5"/>'
  };
  return '<svg '+s+'>'+(map[name]||map.box)+'</svg>';
}
function badge(status){

function snackbar(msg,icon){
  let wrap=document.getElementById('snack-wrap');
  if(!wrap){wrap=document.createElement('div');wrap.id='snack-wrap';wrap.className='snackbar-wrap';document.getElementById('screen').appendChild(wrap);}
  const s=document.createElement('div');s.className='snackbar';s.innerHTML=ic(icon||'check',15)+'<span>'+msg+'</span>';
  wrap.appendChild(s);
  setTimeout(()=>{s.style.opacity='0';s.style.transition='opacity .25s';setTimeout(()=>s.remove(),250);},2500);
}
function openSheet(html){
  let bd=document.getElementById('sheet-backdrop'),sh=document.getElementById('sheet');
  if(!bd){
    bd=document.createElement('div');bd.id='sheet-backdrop';bd.className='sheet-backdrop';
    sh=document.createElement('div');sh.id='sheet';sh.className='sheet';
    document.getElementById('screen').appendChild(bd);document.getElementById('screen').appendChild(sh);
    bd.addEventListener('click',closeSheet);
  }
  sh.innerHTML='<div class="sheet-handle"></div>'+html;
  requestAnimationFrame(()=>{bd.classList.add('open');sh.classList.add('open');});
}
function closeSheet(){
  const bd=document.getElementById('sheet-backdrop'),sh=document.getElementById('sheet');
  if(bd){bd.classList.remove('open');sh.classList.remove('open');}
}

/* ============================= STATE ============================= */
let phase='splash'; // splash | auth | app
let authScreen='login'; // login | registro | recuperar
let recStep=1;
let demoRole='cliente';
let role=null; // cliente | domiciliario
let tab=null;
let stack=[];

function go(route){stack.push(route);render();}
function back(){stack.pop();render();}
function setTab(t){tab=t;stack=[];render();}
function loginAs(r){role=r;tab=(r==='cliente')?'inicio':'inicio';stack=[];phase='app';render();}
function logout(){role=null;phase='auth';authScreen='login';render();}

/* ============================= RENDER DISPATCH ============================= */
function render(){
  const el=document.getElementById('screen');
  let inner='';
  if(phase==='splash'){inner=screenSplash();}
  else if(phase==='auth'){
    if(authScreen==='login')inner=wrapAuth(screenLogin());
    else if(authScreen==='registro')inner=wrapAuth(screenRegistro());
    else inner=wrapAuth(screenRecuperar());
  } else {
    inner=wrapApp();
  }
  el.innerHTML=inner;
  wireCommon();
  if(phase==='app')wireAppScreen();
  if(phase==='auth')wireAuthScreen();
}
function statusBar(){
  return '<div class="status-bar"><span>9:41</span><div class="status-icons">'+ic('gauge',13,2)+ic('phone',13,2)+ic('box',13,2)+'</div></div>';

/* ============================= WIRE APP ACTIONS ============================= */
function wireScreenActions(){
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
    const r=b.dataset.go;
    if(r==='incidencias-jump'){setTab('incidencias');return;}
    go(r);
  }));
  document.querySelectorAll('[data-go2]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.go2)));
  document.querySelectorAll('[data-switch]').forEach(s=>s.addEventListener('click',()=>{s.classList.toggle('on');s.innerHTML='<div class="thumb"></div>';}));
  document.querySelectorAll('[data-radio]').forEach(r=>r.addEventListener('click',()=>{
    document.querySelectorAll('[data-radio="'+r.dataset.radio+'"]').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');
  }));
  document.querySelectorAll('[data-mcal]').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('[data-mcal]').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
  }));
  const rr=document.getElementById('btn-reingresar'); if(rr)rr.addEventListener('click',()=>snackbar('Solicitud de reingreso enviada','check'));
  const sr=document.getElementById('btn-send-renov'); if(sr)sr.addEventListener('click',()=>{snackbar('Solicitud de renovación enviada','check');back();});

render();
