    /* ============================= INLINE EXPAND FILTER ENGINE ============================= */
    function initExcelTableFilters(root) {
      root = root || document.getElementById('content');
      if (!root) return;

      const tables = root.querySelectorAll('table');
      tables.forEach(table => {
        if (table.classList.contains('perm-matrix') || table.classList.contains('no-excel-filter')) return;

        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');
        if (!thead || !tbody) return;

        if (!table._excelFilters) table._excelFilters = {};
        if (!table._sortState) table._sortState = { colIndex: -1, asc: true };
        if (typeof table._openFilterCol === 'undefined') table._openFilterCol = -1;

        const panel = table.closest('.panel');
        let chipsBar = null;
        let footerBar = null;
        if (panel) {
          chipsBar = panel.querySelector('.active-filters-bar');
          if (!chipsBar) {
            chipsBar = document.createElement('div');
            chipsBar.className = 'active-filters-bar';
            chipsBar.innerHTML =
              '<div class="active-chips-left">' +
              '<span class="active-filters-label">ACTIVE:</span>' +
              '<div class="active-chips-holder" style="display:flex;gap:6px;flex-wrap:wrap"></div>' +
              '</div>' +
              '<div class="active-filters-count"></div>';
            panel.insertBefore(chipsBar, table);
          }

          footerBar = panel.querySelector('.table-dimmed-footer');
          if (!footerBar) {
            footerBar = document.createElement('div');
            footerBar.className = 'table-dimmed-footer';
            footerBar.innerHTML =
              '<span class="dimmed-summary-text"></span>' +
              '<button type="button" class="btn-reset-all-dimmed" id="btn-reset-all-dimmed">Reset all filters</button>';
            table.insertAdjacentElement('afterend', footerBar);

            footerBar.querySelector('#btn-reset-all-dimmed').addEventListener('click', () => {
              table._excelFilters = {};
              table._openFilterCol = -1;
              globalSearchQuery = '';
              const topInput = document.getElementById('global-search-input');
              if (topInput) topInput.value = '';
              renderInlineFilterRow(table, -1);
              applyAllTableFilters(table);
              toast('Todos los filtros restablecidos');
            });
          }
        }

        // Add inline expand filter row to thead if not present
        let inlineRow = thead.querySelector('tr.inline-filter-row');
        const ths = thead.querySelectorAll('tr:not(.inline-filter-row) th');
        if (!inlineRow) {
          inlineRow = document.createElement('tr');
          inlineRow.className = 'inline-filter-row';
          inlineRow.style.display = 'none';
          inlineRow.innerHTML = '<td colspan="' + (ths.length || 6) + '"><div class="inline-filter-container"></div></td>';
          thead.appendChild(inlineRow);
        }

        ths.forEach((th, colIdx) => {
          if (th.dataset.excelInit === '1') return;
          const thText = th.textContent.trim();
          if (thText.toLowerCase() === 'acciones' || thText.toLowerCase() === 'acción' || thText.toLowerCase() === 'auditar' || (th.style.textAlign === 'right' && thText === '') || colIdx === ths.length - 1) {
            th.dataset.excelInit = '1';
            th.classList.add('th-actions');
            th.style.textAlign = 'center';
            th.innerHTML = '<div class="th-actions-wrap"><span>' + (thText || 'ACCIONES') + '</span></div>';
            return;
          }

          th.dataset.excelInit = '1';
          th.dataset.colIndex = colIdx;
          th.dataset.colName = thText;

          th.innerHTML =
            '<div class="th-wrap">' +
            '<span class="th-label" title="Ordenar por ' + thText + ' (A a Z)">' +
            '<span>' + thText + '</span>' +
            '<span class="th-sort-ic">⇅</span>' +
            '</span>' +
            '<button type="button" class="th-filter-btn" title="Expandir filtro de ' + thText + '">' +
            '<span class="th-filter-dot">●</span>' +
            '<span class="th-filter-arrow">▾</span>' +
            '</button>' +
            '</div>';

          // Click on column label -> Sorts A-Z / Z-A
          const lblEl = th.querySelector('.th-label');
          if (lblEl) {
            lblEl.addEventListener('click', (e) => {
              e.stopPropagation();
              const isCurrent = table._sortState.colIndex === colIdx;
              const asc = isCurrent ? !table._sortState.asc : true;
              table._sortState = { colIndex: colIdx, asc: asc };
              sortTableByColumn(table, colIdx, asc);
              ths.forEach((otherTh, oIdx) => {
                const icEl = otherTh.querySelector('.th-sort-ic');
                if (icEl) {
                  if (oIdx === colIdx) icEl.textContent = asc ? '▲' : '▼';
                  else icEl.textContent = '⇅';
                }
              });
            });
          }

          // Click on filter button -> Toggles inline row in thead
          const btnEl = th.querySelector('.th-filter-btn');
          if (btnEl) {
            btnEl.addEventListener('click', (e) => {
              e.stopPropagation();
              if (table._openFilterCol === colIdx) {
                table._openFilterCol = -1;
              } else {
                table._openFilterCol = colIdx;
              }
              renderInlineFilterRow(table, table._openFilterCol);
            });
          }
        });

        applyAllTableFilters(table);
      });
    }

    function getColumnFrequencies(table, colIdx) {
      const tbody = table.querySelector('tbody');
      if (!tbody) return { values: [], freqMap: {}, maxCount: 1 };
      const rows = tbody.querySelectorAll('tr');
      const freqMap = {};

      rows.forEach(tr => {
        const cells = tr.querySelectorAll('td');
        if (cells.length > colIdx) {
          let val = cells[colIdx].innerText || cells[colIdx].textContent || '';
          val = val.trim().replace(/\s+/g, ' ');
          if (val && val !== '—') {
            freqMap[val] = (freqMap[val] || 0) + 1;
          }
        }
      });

      const values = Object.keys(freqMap).sort((a, b) => {
        return freqMap[b] - freqMap[a] || a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' });
      });

      let maxCount = 1;
      values.forEach(v => {
        if (freqMap[v] > maxCount) maxCount = freqMap[v];
      });

      return { values, freqMap, maxCount };
    }

    function renderInlineFilterRow(table, colIdx) {
      const thead = table.querySelector('thead');
      if (!thead) return;
      const inlineRow = thead.querySelector('tr.inline-filter-row');
      if (!inlineRow) return;
      const container = inlineRow.querySelector('.inline-filter-container');
      const ths = thead.querySelectorAll('tr:not(.inline-filter-row) th');

      ths.forEach(th => th.classList.remove('th-filter-open'));

      if (colIdx < 0 || colIdx >= ths.length) {
        inlineRow.style.display = 'none';
        return;
      }

      const activeTh = ths[colIdx];
      if (activeTh) activeTh.classList.add('th-filter-open');

      const colName = (activeTh && activeTh.dataset.colName) || ('Columna ' + (colIdx + 1));
      const { values, freqMap, maxCount } = getColumnFrequencies(table, colIdx);
      const currentFilterVal = table._excelFilters[colIdx];

      let cardsHtml = '';
      values.forEach(v => {
        const count = freqMap[v];
        const pct = Math.round((count / maxCount) * 100);
        const isSel = currentFilterVal === v;
        cardsHtml +=
          '<div class="inline-value-card' + (isSel ? ' selected' : '') + '" data-val="' + encodeURIComponent(v) + '">' +
          '<div class="inline-value-top">' +
          '<span class="inline-value-label" title="' + v + '">' + v + '</span>' +
          '<span class="inline-value-count">' + count + '</span>' +
          '</div>' +
          '<div class="inline-freq-bar-bg"><div class="inline-freq-bar-fill" style="width:' + pct + '%"></div></div>' +
          '</div>';
      });

      container.innerHTML =
        '<div class="inline-filter-head">' +
        '<div class="inline-filter-title">' +
        '<span>Valores de <strong>' + colName + '</strong> (' + values.length + ' únicos)</span>' +
        '</div>' +
        '<div class="inline-filter-head-actions">' +
        '<button type="button" class="inline-filter-btn-action" id="btn-inline-clear-this">Mostrar todos</button>' +
        '<button type="button" class="inline-filter-btn-action" id="btn-inline-close">Cerrar ✕</button>' +
        '</div>' +
        '</div>' +
        '<div class="inline-filter-values-grid">' + cardsHtml + '</div>';

      inlineRow.style.display = '';

      container.querySelectorAll('.inline-value-card').forEach(card => {
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          const rawVal = card.dataset.val;
          const val = decodeURIComponent(rawVal);
          if (table._excelFilters[colIdx] === val) {
            delete table._excelFilters[colIdx];
          } else {
            table._excelFilters[colIdx] = val;
          }
          applyAllTableFilters(table);
          renderInlineFilterRow(table, colIdx);
        });
      });

      const clearThisBtn = container.querySelector('#btn-inline-clear-this');
      if (clearThisBtn) {
        clearThisBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          delete table._excelFilters[colIdx];
          applyAllTableFilters(table);
          renderInlineFilterRow(table, colIdx);
        });
      }

      const closeBtn = container.querySelector('#btn-inline-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          table._openFilterCol = -1;
          renderInlineFilterRow(table, -1);
        });
      }
    }

    function filterByExactMatch(table, colIdx, value) {
      if (!table._excelFilters) table._excelFilters = {};
      if (!value || value === '__ALL__') {
        delete table._excelFilters[colIdx];
      } else {
        table._excelFilters[colIdx] = value;
      }
      applyAllTableFilters(table);
    }

    function applyAllTableFilters(table) {
      if (!table) return;
      const thead = table.querySelector('thead');
      const tbody = table.querySelector('tbody');
      if (!thead || !tbody) return;

      const ths = thead.querySelectorAll('tr:not(.inline-filter-row) th');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const filters = table._excelFilters || {};
      const activeColIndices = Object.keys(filters).map(k => parseInt(k, 10));

      ths.forEach((th, idx) => {
        const btn = th.querySelector('.th-filter-btn');
        const isActive = activeColIndices.includes(idx);
        th.classList.toggle('th-has-filter', isActive);
        if (btn) {
          btn.classList.toggle('active', isActive);
          btn.title = isActive ? 'Filtro activo: ' + filters[idx] + ' (Clic para cambiar)' : 'Expandir filtro de ' + (th.dataset.colName || 'columna');
        }
      });

      const hasActiveFilters = activeColIndices.length > 0 || !!globalSearchQuery;
      let matchedCount = 0;
      let dimmedCount = 0;
      const matchedRows = [];
      const dimmedRows = [];

      rows.forEach((tr, rowIdx) => {
        if (!tr.dataset.origIndex) tr.dataset.origIndex = rowIdx;
        const cells = tr.querySelectorAll('td');
        let matchAllCols = true;

        for (let colIdx of activeColIndices) {
          const requiredVal = (filters[colIdx] || '').toLowerCase().trim();
          if (!requiredVal) continue;

          if (cells.length > colIdx) {
            const cellText = (cells[colIdx].innerText || cells[colIdx].textContent || '').toLowerCase().trim();
            if (cellText.indexOf(requiredVal) === -1 && requiredVal.indexOf(cellText) === -1) {
              matchAllCols = false;
              break;
            }
          } else {
            matchAllCols = false;
            break;
          }
        }

        let matchGlobal = true;
        if (globalSearchQuery) {
          const rowText = (tr.innerText || tr.textContent || '').toLowerCase();
          if (rowText.indexOf(globalSearchQuery) === -1) {
            matchGlobal = false;
          }
        }

        const isMatched = matchAllCols && matchGlobal;
        if (hasActiveFilters) {
          if (isMatched) {
            tr.classList.remove('row-dimmed');
            tr.classList.add('row-matched');
            matchedRows.push(tr);
            matchedCount++;
          } else {
            tr.classList.add('row-dimmed');
            tr.classList.remove('row-matched');
            dimmedRows.push(tr);
            dimmedCount++;
          }
        } else {
          tr.classList.remove('row-dimmed', 'row-matched');
          matchedRows.push(tr);
          matchedCount++;
        }
      });

      // Flotar registros coincidentes al inicio de la tabla para visualización inmediata
      if (hasActiveFilters) {
        matchedRows.forEach(r => tbody.appendChild(r));
        dimmedRows.forEach(r => tbody.appendChild(r));
      } else {
        if (table._sortState && table._sortState.colIndex !== -1) {
          sortTableByColumn(table, table._sortState.colIndex, table._sortState.asc);
        } else {
          rows.sort((a, b) => parseInt(a.dataset.origIndex || 0, 10) - parseInt(b.dataset.origIndex || 0, 10));
          rows.forEach(r => tbody.appendChild(r));
        }
      }

      const panel = table.closest('.panel');
      if (panel) {
        const chipsBar = panel.querySelector('.active-filters-bar');
        const footerBar = panel.querySelector('.table-dimmed-footer');

        if (chipsBar) {
          chipsBar.classList.toggle('has-filters', hasActiveFilters);
          if (hasActiveFilters) {
            const holder = chipsBar.querySelector('.active-chips-holder');
            const countEl = chipsBar.querySelector('.active-filters-count');

            let chipsHtml = '';
            if (globalSearchQuery) {
              chipsHtml +=
                '<span class="filter-chip-item">' +
                '<span class="filter-chip-col">BUSCADOR</span>' +
                '<span class="filter-chip-val">"' + globalSearchQuery + '"</span>' +
                '<span class="filter-chip-remove" data-remove-global="1" title="Quitar búsqueda">✕</span>' +
                '</span>';
            }

            activeColIndices.forEach(colIdx => {
              const colName = (ths[colIdx] && ths[colIdx].dataset.colName) || ('Columna ' + (colIdx + 1));
              const val = filters[colIdx];
              chipsHtml +=
                '<span class="filter-chip-item">' +
                '<span class="filter-chip-col">' + colName + '</span>' +
                '<span class="filter-chip-val">' + val + '</span>' +
                '<span class="filter-chip-remove" data-remove-col="' + colIdx + '" title="Quitar filtro de ' + colName + '">✕</span>' +
                '</span>';
            });

            if (holder) holder.innerHTML = chipsHtml;
            if (countEl) countEl.textContent = matchedCount + ' / ' + rows.length;

            chipsBar.querySelectorAll('[data-remove-col]').forEach(btn => {
              btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const cIdx = parseInt(btn.dataset.removeCol, 10);
                delete table._excelFilters[cIdx];
                if (table._openFilterCol === cIdx) renderInlineFilterRow(table, cIdx);
                applyAllTableFilters(table);
              });
            });

            const removeGlobalBtn = chipsBar.querySelector('[data-remove-global]');
            if (removeGlobalBtn) {
              removeGlobalBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                globalSearchQuery = '';
                const topInput = document.getElementById('global-search-input');
                if (topInput) topInput.value = '';
                applyAllTableFilters(table);
              });
            }
          }
        }

        if (footerBar) {
          footerBar.classList.toggle('has-dimmed', hasActiveFilters);
          const summaryText = footerBar.querySelector('.dimmed-summary-text');
          if (summaryText) {
            summaryText.textContent = matchedCount + ' of ' + rows.length + ' rows · ' + dimmedCount + ' dimmed';
          }
        }

        const paginationSpan = panel.querySelector('.pagination > span');
        if (paginationSpan && !panel.querySelector('#cli-showing-count')) {
          if (hasActiveFilters) {
            paginationSpan.textContent = 'Mostrando ' + matchedCount + ' coincidentes de ' + rows.length + ' registros (' + dimmedCount + ' atenuados)';
          } else {
            paginationSpan.textContent = 'Mostrando ' + rows.length + ' de ' + rows.length + ' registros';
          }
        }
      }
    }

    function sortTableByColumn(table, colIdx, asc) {
      const tbody = table.querySelector('tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));

      rows.sort((a, b) => {
        const aCells = a.querySelectorAll('td');
        const bCells = b.querySelectorAll('td');
        if (!aCells[colIdx] || !bCells[colIdx]) return 0;

        const aText = (aCells[colIdx].innerText || aCells[colIdx].textContent || '').trim();
        const bText = (bCells[colIdx].innerText || bCells[colIdx].textContent || '').trim();

        const aNum = parseFloat(aText.replace(/[^0-9.-]+/g, ''));
        const bNum = parseFloat(bText.replace(/[^0-9.-]+/g, ''));

        if (!isNaN(aNum) && !isNaN(bNum) && aText.match(/\d/)) {
          return asc ? aNum - bNum : bNum - aNum;
        }

        return asc ? aText.localeCompare(bText, 'es', { numeric: true }) : bText.localeCompare(aText, 'es', { numeric: true });
      });

      rows.forEach(r => tbody.appendChild(r));
    }

          const cliDoc = cliSel ? cliSel.value : '';

          const planPrice = parseInt(planParts[1], 10) || 128000;
          const isNueva = modSel ? modSel.value === 'Venta nueva' : true;

        if (modSel) modSel.addEventListener('change', updateSubCalc);
      }, 50);
    }

          if (prodObj) {
            prodObj.ficha = 'Asociada';
            prodObj.costo = costoFormatted;
            prodObj.categoria = categoria;
          } else {
            DEMO_STATE.productos.push({
              nombre: prodName,
              categoria: categoria,
              ficha: 'Asociada',
              porcion: '1 porción',
              costo: costoFormatted,
              estado: 'Activo'
            });
          }

          navigate('fichas');
          setTimeout(() => {
            const sel = document.getElementById('ficha-selector');
            if (sel) {
              sel.value = prodName;
              sel.dispatchEvent(new Event('change'));
            }
          }, 60);
        },
        '780px'
      );

      // Vincular eventos interactivos del modal
      const modalBox = document.getElementById('modal-box');
      if (!modalBox) return;

      // 1. Pestañas
      modalBox.querySelectorAll('#ft-modal-tabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          modalBox.querySelectorAll('#ft-modal-tabs .tab-btn').forEach(b => b.classList.remove('active'));
          modalBox.querySelectorAll('.ft-modal-wrap .tab-pane').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          const target = modalBox.querySelector('#' + btn.dataset.tab);
          if (target) target.classList.add('active');
        });
      });

      // 2. Selector de producto y cambio de categoría
      const selectProd = modalBox.querySelector('#ft-select-product');
      const selectCat = modalBox.querySelector('#ft-select-category');
      const customWrap = modalBox.querySelector('#ft-custom-prod-wrap');
      const inputCodigo = modalBox.querySelector('#ft-input-codigo');

      if (selectProd) {
        selectProd.addEventListener('change', () => {
          if (selectProd.value === '__NEW__') {
            if (customWrap) customWrap.style.display = 'block';
          } else {
            if (customWrap) customWrap.style.display = 'none';
            const opt = selectProd.options[selectProd.selectedIndex];
            if (opt && opt.dataset.cat && selectCat) {
              selectCat.value = opt.dataset.cat;
            }
          }
        });
      }

      if (selectCat && !isEditing) {
        selectCat.addEventListener('change', () => {
          const pref = selectCat.value.substring(0, 3).toUpperCase();
          if (inputCodigo && !isEditing) {
            inputCodigo.value = 'FT-' + pref + '-' + String(DEMO_STATE.fichas.length + 1).padStart(3, '0');
          }
        });
      }

      // 3. Tiempos cálculo automático
      const timePrepInput = modalBox.querySelector('#ft-input-time-prep');
      const timeCookInput = modalBox.querySelector('#ft-input-time-cook');
      const timeTotalInput = modalBox.querySelector('#ft-input-time-total');
      function updateTimeTotal() {
        const p = parseInt(timePrepInput ? timePrepInput.value : 0, 10) || 0;
        const c = parseInt(timeCookInput ? timeCookInput.value : 0, 10) || 0;
        if (timeTotalInput) timeTotalInput.value = (p + c) + ' min';
      }
      if (timePrepInput) timePrepInput.addEventListener('input', updateTimeTotal);
      if (timeCookInput) timeCookInput.addEventListener('input', updateTimeTotal);

      // 4. Insumos y Costeo BOM interactivo
      const insSelect = modalBox.querySelector('#ft-ins-sel');
      const insManualWrap = modalBox.querySelector('#ft-ins-manual-wrap');
      const insQty = modalBox.querySelector('#ft-ins-qty');
      const insUm = modalBox.querySelector('#ft-ins-um');
      const insMerma = modalBox.querySelector('#ft-ins-merma');
      const insCost = modalBox.querySelector('#ft-ins-cost');
      const btnAddIns = modalBox.querySelector('#ft-btn-add-insumo');
      const insTbody = modalBox.querySelector('#ft-insumos-tbody');
      const insCountEl = modalBox.querySelector('#ft-ins-count');
      const batchInput = modalBox.querySelector('#ft-input-batch');

      if (insSelect) {
        insSelect.addEventListener('change', () => {
          if (insSelect.value === '__MANUAL__') {
            if (insManualWrap) insManualWrap.style.display = 'block';
            if (insCost) insCost.value = '5.0';
          } else {
            if (insManualWrap) insManualWrap.style.display = 'none';
            const opt = insSelect.options[insSelect.selectedIndex];
            if (opt) {
              const cost = parseFloat(opt.dataset.cost) || 4.2;
              const um = opt.dataset.um || 'g';
              if (insCost) insCost.value = cost;
              if (insUm) insUm.value = (um === 'kg' ? 'g' : (um === 'L' ? 'ml' : um));
            }
          }
        });
      }

      function renderInsumosTable() {
        if (!insTbody) return;
        if (tempInsumosList.length === 0) {
          insTbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--ink-400);padding:14px">No hay insumos añadidos. Agrega los ingredientes para calcular el costeo.</td></tr>';
        } else {
          insTbody.innerHTML = tempInsumosList.map((item, idx) => {
            return '<tr>' +
              '<td class="strong">' + item.nombre + '</td>' +
              '<td class="mono">' + item.cantBruta + ' ' + item.um + '</td>' +
              '<td class="mono">' + item.merma + '%</td>' +
              '<td class="mono">' + (Math.round(item.cantNeta * 10) / 10) + ' ' + item.um + '</td>' +
              '<td class="mono">$' + (item.costoUnit >= 100 ? item.costoUnit.toLocaleString('es-CO') : item.costoUnit) + '</td>' +
              '<td class="mono font-bold">$' + Math.round(item.subtotal).toLocaleString('es-CO') + '</td>' +
              '<td><button type="button" class="mini-ic danger ft-del-ins" data-idx="' + idx + '" title="Quitar insumo">' + ic('trash', 13) + '</button></td>' +
              '</tr>';
          }).join('');

          insTbody.querySelectorAll('.ft-del-ins').forEach(btn => {
            btn.addEventListener('click', () => {
              const i = parseInt(btn.dataset.idx, 10);
              tempInsumosList.splice(i, 1);
              renderInsumosTable();
              recalcBOMCosts();
            });
          });
        }

        if (insCountEl) insCountEl.textContent = tempInsumosList.length;
      }

      function recalcBOMCosts() {
        let totalMP = 0;
        tempInsumosList.forEach(item => {
          totalMP += (item.subtotal || 0);
        });

        const batch = parseInt(batchInput ? batchInput.value : 1, 10) || 1;
        const cifVal = Math.round(totalMP * (tempCifPercent / 100));
        const totalBatch = totalMP + cifVal;
        const unitCost = Math.round(totalBatch / batch);
        const pvp = Math.round(unitCost * 2.6 / 100) * 100;

        const mpEl = modalBox.querySelector('#ft-cost-mp');
        const cifEl = modalBox.querySelector('#ft-cost-cif');
        const unitEl = modalBox.querySelector('#ft-cost-unit');
        const pvpEl = modalBox.querySelector('#ft-cost-pvp');

        if (mpEl) mpEl.textContent = '$' + Math.round(totalMP).toLocaleString('es-CO');
        if (cifEl) cifEl.textContent = '$' + cifVal.toLocaleString('es-CO');
        if (unitEl) unitEl.textContent = '$' + unitCost.toLocaleString('es-CO');
        if (pvpEl) pvpEl.textContent = '$' + pvp.toLocaleString('es-CO');
      }

      if (btnAddIns) {
        btnAddIns.addEventListener('click', () => {
          let name = '';
          if (insSelect.value === '__MANUAL__') {
            name = (modalBox.querySelector('#ft-ins-manual-name').value || '').trim() || 'Insumo especial';
          } else {
            name = insSelect.value;
          }

          const qty = parseFloat(insQty.value) || 10;
          const um = insUm.value;
          const merma = parseFloat(insMerma.value) || 0;
          const cost = parseFloat(insCost.value) || 4.2;

          const neta = qty * (1 - (merma / 100));
          const subtotal = qty * cost;

          tempInsumosList.push({
            nombre: name,
            cantBruta: qty,
            um: um,
            merma: merma,
            cantNeta: neta,
            costoUnit: cost,
            subtotal: subtotal
          });

          renderInsumosTable();
          recalcBOMCosts();

          // Resetear cantidad básica
          if (insQty) insQty.value = '50';
          if (insMerma) insMerma.value = '0';
        });
      }

      if (batchInput) batchInput.addEventListener('input', recalcBOMCosts);

      // 5. Chips interactivos de dietas, alérgenos y equipos
      modalBox.querySelectorAll('#ft-dietas-chips .tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const val = chip.dataset.val;
          if (tempRestricciones.includes(val)) {
            tempRestricciones = tempRestricciones.filter(x => x !== val);
            chip.style.background = 'var(--bg)';
            chip.style.color = 'var(--ink-700)';
            chip.style.fontWeight = '500';
            chip.textContent = '+ ' + val;
          } else {
            tempRestricciones.push(val);
            chip.style.background = 'var(--ok-bg)';
            chip.style.color = 'var(--ok)';
            chip.style.fontWeight = '700';
            chip.textContent = '✓ ' + val;
          }
        });
      });

      modalBox.querySelectorAll('#ft-alergenos-chips .tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const val = chip.dataset.val;
          if (val === 'Ninguno') {
            tempAlergenos = ['Ninguno'];
            modalBox.querySelectorAll('#ft-alergenos-chips .tag-chip').forEach(c => {
              if (c.dataset.val === 'Ninguno') {
                c.style.background = 'var(--bad-bg)';
                c.style.color = 'var(--bad)';
                c.style.fontWeight = '700';
                c.textContent = '⚠️ Ninguno';
              } else {
                c.style.background = 'var(--bg)';
                c.style.color = 'var(--ink-700)';
                c.style.fontWeight = '500';
                c.textContent = '+ ' + c.dataset.val;
              }
            });
            return;
          }

          tempAlergenos = tempAlergenos.filter(x => x !== 'Ninguno');
          const noneChip = modalBox.querySelector('#ft-alergenos-chips [data-val="Ninguno"]');
          if (noneChip) {
            noneChip.style.background = 'var(--bg)';
            noneChip.style.color = 'var(--ink-700)';
            noneChip.style.fontWeight = '500';
            noneChip.textContent = '+ Ninguno';
          }

          if (tempAlergenos.includes(val)) {
            tempAlergenos = tempAlergenos.filter(x => x !== val);
            chip.style.background = 'var(--bg)';
            chip.style.color = 'var(--ink-700)';
            chip.style.fontWeight = '500';
            chip.textContent = '+ ' + val;
            if (tempAlergenos.length === 0) {
              tempAlergenos = ['Ninguno'];
              if (noneChip) {
                noneChip.style.background = 'var(--bad-bg)';
                noneChip.style.color = 'var(--bad)';
                noneChip.style.fontWeight = '700';
                noneChip.textContent = '⚠️ Ninguno';
              }
            }
          } else {
            tempAlergenos.push(val);
            chip.style.background = 'var(--bad-bg)';
            chip.style.color = 'var(--bad)';
            chip.style.fontWeight = '700';
            chip.textContent = '⚠️ ' + val;
          }
        });
      });

      modalBox.querySelectorAll('#ft-equipos-chips .tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const val = chip.dataset.val;
          if (tempEquipos.includes(val)) {
            tempEquipos = tempEquipos.filter(x => x !== val);
            chip.style.background = 'var(--bg)';
            chip.style.color = 'var(--ink-700)';
            chip.style.fontWeight = '500';
            chip.textContent = '+ ' + val;
          } else {
            tempEquipos.push(val);
            chip.style.background = 'var(--accent-bg)';
            chip.style.color = 'var(--accent)';
            chip.style.fontWeight = '700';
            chip.textContent = '✓ ' + val;
          }
        });
      });

      // Render inicial de tabla y costos
      renderInsumosTable();
      recalcBOMCosts();
    }

    function renderDynamicSvgChart(points, type, color) {
      color = color || 'var(--accent)';
      const w = 840, hgt = 180;
      const values = points.map(p => p.v);
      const max = Math.max(...values) * 1.18;
      const min = Math.min(...values) * 0.85;

      if (type === 'bar') {
        const bw = (w / points.length) - 24;
        let bars = '', labels = '';
        points.forEach((p, i) => {
          const bh = Math.max(12, (p.v / max) * (hgt - 36));
          const x = i * (w / points.length) + 12;
          bars += '<rect x="' + x + '" y="' + (hgt - 24 - bh) + '" width="' + bw + '" height="' + bh + '" rx="4" fill="' + color + '" opacity="' + (0.55 + 0.45 * (i / points.length)) + '"/>';
          labels += '<text x="' + (x + bw / 2) + '" y="' + (hgt - 6) + '" font-size="11" fill="#71717A" text-anchor="middle" font-family="Inter" font-weight="500">' + p.l + '</text>';
        });
        return '<svg class="svg-chart" viewBox="0 0 ' + w + ' ' + hgt + '">' + bars + labels + '</svg>';
      } else {
        const stepX = (w - 30) / Math.max(1, points.length - 1);
        let pts = points.map((p, i) => [15 + i * stepX, hgt - 28 - ((p.v - min) / Math.max(1, max - min)) * (hgt - 48)]);
        let path = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
        let area = 'M15,' + (hgt - 24) + ' L' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' L' + (w - 15) + ',' + (hgt - 24) + ' Z';
        let dots = pts.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + color + '" stroke="#fff" stroke-width="1.8"/>').join('');
        let labels = points.map((p, i) => '<text x="' + pts[i][0] + '" y="' + (hgt - 6) + '" font-size="11" fill="#71717A" text-anchor="middle" font-family="Inter" font-weight="500">' + p.l + '</text>').join('');
        return '<svg class="svg-chart" viewBox="0 0 ' + w + ' ' + hgt + '"><path d="' + area + '" fill="' + color + '" opacity="0.1"/><path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' + dots + labels + '</svg>';
      }
    }

    function attachSuscripcionesScreenEvents(container) {
      // 0. Cargar más solicitudes (10 en 10)
      const btnMoreSubs = container.querySelector('#btn-ver-mas-subs');
      if (btnMoreSubs) {
        btnMoreSubs.addEventListener('click', () => {
          subsVisibleLimit += 10;
          const content = document.getElementById('content');
          if (content && currentRoute === 'suscripciones') {
            content.innerHTML = R['suscripciones']();
            attachRowActions(content);
            attachSuscripcionesScreenEvents(content);
            toast('10 solicitudes adicionales cargadas');
          }
        });
      }

      // 1. Selector de fila en la tabla
      container.querySelectorAll('.sub-table-row, .sub-select-btn').forEach(el => {
        el.addEventListener('click', (e) => {
          const subId = el.dataset.subId;
          if (!subId) return;
          selectedSubId = subId;
          const content = document.getElementById('content');
          if (content && currentRoute === 'suscripciones') {
            content.innerHTML = R['suscripciones']();
            attachRowActions(content);
            attachSuscripcionesScreenEvents(content);
          }
        });
      });

      // 1.1 Zoom en la captura del comprobante
      const btnZoom = container.querySelector('#btn-zoom-voucher');
      if (btnZoom) {
        btnZoom.addEventListener('click', () => {
          const subId = btnZoom.dataset.subId;
          const sub = DEMO_STATE.suscripciones.find(s => s.id === subId);
          if (sub) openVoucherZoomModal(sub);
        });
      }

      // 2. Buscador en vivo
      const searchInput = container.querySelector('#sub-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          subSearchQuery = e.target.value;
          visibleSubsCount = 10;
          const content = document.getElementById('content');
          if (content && currentRoute === 'suscripciones') {
            content.innerHTML = R['suscripciones']();
            attachRowActions(content);
            attachSuscripcionesScreenEvents(content);
            const newSearch = document.getElementById('sub-search-input');
            if (newSearch) {
              newSearch.focus();
              newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length);
            }
          }
        });
      }

      // 3. Filtro de estado
      const estadoSel = container.querySelector('#sub-estado-sel');
      if (estadoSel) {
        estadoSel.addEventListener('change', (e) => {
          subEstadoFilter = e.target.value;
          visibleSubsCount = 10;
          const content = document.getElementById('content');
          if (content && currentRoute === 'suscripciones') {
            content.innerHTML = R['suscripciones']();
            attachRowActions(content);
            attachSuscripcionesScreenEvents(content);
          }
        });
      }

      // 4. Limpiar filtros
      const resetBtn = container.querySelector('#sub-reset-filters');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          subSearchQuery = '';
          subEstadoFilter = '';
          visibleSubsCount = 10;
          const content = document.getElementById('content');
          if (content && currentRoute === 'suscripciones') {
            content.innerHTML = R['suscripciones']();
            attachRowActions(content);
            attachSuscripcionesScreenEvents(content);
            toast('Filtros reestablecidos');
          }
        });
      }

      // 4.1 Paginación progresiva Cargar Más
      const loadMoreBtn = container.querySelector('#btn-cargar-mas-subs');
      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', () => {
          const tbody = container.querySelector('#subs-tbody');
          if (!tbody) return;

          const filteredSubs = DEMO_STATE.suscripciones.filter(s => {
            const matchesQuery = !subSearchQuery || (s.id + ' ' + s.cliente + ' ' + s.doc + ' ' + (s.comprobante ? s.comprobante.referencia : '')).toLowerCase().indexOf(subSearchQuery.toLowerCase()) !== -1;
            let matchesEstado = true;
            if (subEstadoFilter === 'Pendiente') matchesEstado = s.estado === 'Pendiente';
            else if (subEstadoFilter === 'Activa') matchesEstado = s.estado === 'Activa';
            else if (subEstadoFilter === 'Vencida') matchesEstado = s.estado === 'Vencida' || s.estado === 'Cancelada';
            return matchesQuery && matchesEstado;
          });

          const currentCount = visibleSubsCount;
          const nextCount = currentCount + 10;
          const newItems = filteredSubs.slice(currentCount, nextCount);

          if (newItems.length > 0) {
            let newRowsHtml = '';
            newItems.forEach(s => {
              newRowsHtml += renderSubRow(s);
            });
            tbody.insertAdjacentHTML('beforeend', newRowsHtml);
            visibleSubsCount = nextCount;

            // Re-attach actions
            attachRowActions(tbody);
            tbody.querySelectorAll('.sub-table-row, .sub-select-btn').forEach(el => {
              el.addEventListener('click', () => {
                const subId = el.dataset.subId;
                if (!subId) return;
                selectedSubId = subId;
                const inspector = container.querySelector('#sub-inspector-panel');
                const sub = DEMO_STATE.suscripciones.find(x => x.id === subId);
                if (inspector && sub) {
                  inspector.innerHTML = renderSubInspector(sub);
                  attachSuscripcionesScreenEvents(inspector);
                }
              });
            });

            // Update footer count
            const countEl = container.querySelector('#sub-showing-count');
            if (countEl) countEl.textContent = Math.min(visibleSubsCount, filteredSubs.length);

            const remaining = Math.max(0, filteredSubs.length - visibleSubsCount);
            const loadBox = container.querySelector('#subs-load-more-box');
            if (loadBox) {
              if (remaining > 0) {
                loadMoreBtn.innerHTML = ic('chevD', 14) + ' Cargar más solicitudes (' + remaining + ' restantes)';
              } else {
                loadMoreBtn.remove();
                const doneMsg = document.createElement('div');
                doneMsg.style.fontSize = '11.5px';
                doneMsg.style.color = 'var(--ink-500)';
                doneMsg.style.display = 'flex';
                doneMsg.style.alignItems = 'center';
                doneMsg.style.gap = '6px';
                doneMsg.innerHTML = ic('check', 14) + ' <span>Todas las solicitudes han sido cargadas</span>';
                loadBox.appendChild(doneMsg);
              }
            }
            toast(newItems.length + ' solicitudes adicionales cargadas');
          }
        });
      }

      // 5. Botón Aprobar Pago y Activar Suscripción
      const btnAprobar = container.querySelector('#btn-aprobar-sub');
      if (btnAprobar) {
        btnAprobar.addEventListener('click', () => {
          const subId = btnAprobar.dataset.subId;
          const sub = DEMO_STATE.suscripciones.find(s => s.id === subId);
          if (!sub) return;

          sub.estado = 'Activa';
          // Actualizar cliente correspondiente
          const cli = DEMO_STATE.clientes.find(c => c.doc === sub.doc || c.nombre === sub.cliente);
          if (cli) {
            cli.suscripcion = {
              plan: sub.plan,
              estado: 'Activa',
              tipo: sub.plan + ' (' + sub.duracion + ')',
              vigencia: sub.fechaInicio + ' - ' + sub.fechaFin,
              diasRestantes: sub.plan.indexOf('Mensual') !== -1 ? 20 : (sub.plan.indexOf('Quincenal') !== -1 ? 10 : 5),
              valor: '$' + sub.total.toLocaleString('es-CO'),
              comprobante: sub.comprobante ? '#' + sub.comprobante.referencia : '#TR-VERIFICADO',
              menu: sub.menu
            };
          }

          toast('Suscripción #' + sub.id + ' de ' + sub.cliente + ' aprobada y activada exitosamente');
          const content = document.getElementById('content');
          if (content && currentRoute === 'suscripciones') {
            content.innerHTML = R['suscripciones']();
            attachRowActions(content);
            attachSuscripcionesScreenEvents(content);
          }
        });
      }

      // 6. Botón Rechazar Comprobante
      const btnRechazar = container.querySelector('#btn-rechazar-sub');
      if (btnRechazar) {
        btnRechazar.addEventListener('click', () => {
          const subId = btnRechazar.dataset.subId;
          const sub = DEMO_STATE.suscripciones.find(s => s.id === subId);
          if (!sub) return;

          openModal(
            'Rechazar comprobante de transferencia',
            '<p class="modal-desc">Indica la causal de inconsistencia encontrada en la auditoría para notificar a <strong>' + sub.cliente + '</strong>.</p>' +
            '<div class="field"><label>Motivo del rechazo</label><select id="rechazo-motivo">' +
            '<option>Transferencia no reflejada en extracto bancario</option>' +
            '<option>Monto transferido no coincide con el valor liquidado</option>' +
            '<option>Comprobante ilegible / adulterado</option>' +
            '<option>Cuenta bancaria receptora incorrecta</option>' +
            '</select></div>' +
            '<div class="field"><label>Observación para el cliente</label><textarea rows="3" placeholder="Detalle adicional que se enviará por WhatsApp / Correo...">Se validó en los movimientos de Bancolombia y no aparece la transferencia con referencia ' + (sub.comprobante ? sub.comprobante.referencia : '') + '.</textarea></div>',
            'Confirmar rechazo',
            () => {
              sub.estado = 'Cancelada';
              toast('Comprobante rechazado. Se ha notificado al cliente para reenviar el soporte de pago');
              const content = document.getElementById('content');
              if (content && currentRoute === 'suscripciones') {
                content.innerHTML = R['suscripciones']();
                attachRowActions(content);
                attachSuscripcionesScreenEvents(content);
              }
            }
          );
        });
      }
    }

      const lon = (MAP_GEO_CONSTS.minLon + (x / MAP_GEO_CONSTS.W) * (MAP_GEO_CONSTS.maxLon - MAP_GEO_CONSTS.minLon)).toFixed(6);
      const lat = (MAP_GEO_CONSTS.maxLat - (y / MAP_GEO_CONSTS.H) * (MAP_GEO_CONSTS.maxLat - MAP_GEO_CONSTS.minLat)).toFixed(6);
      return { lon, lat };

      const y = Math.round(((MAP_GEO_CONSTS.maxLat - parseFloat(lat)) / (MAP_GEO_CONSTS.maxLat - MAP_GEO_CONSTS.minLat)) * MAP_GEO_CONSTS.H);

        () => {
          const nombre = document.getElementById('new-zona-nombre').value.trim();
          const mode = document.getElementById('new-zona-mode').value;
          const templateName = document.getElementById('new-zona-template').value;
          const keywords = document.getElementById('new-zona-keywords').value.trim();

          if (!nombre) {
            toast('Debes indicar el nombre de la zona');
            return;
          }

          let pts = '';
          let cx = 330;
          let cy = 320;

          if (mode === 'template') {
            const tmpl = expansionTemplates.find(t => t.name === templateName) || expansionTemplates[0];
            pts = tmpl.pts;
            cx = tmpl.cx;
            cy = tmpl.cy;
          } else if (mode === 'radius') {
            const rad = parseInt(document.getElementById('new-zona-radius-sel').value, 10) || 60;
            const centerPt = { x: 340, y: 410 };
            const numPoints = 8;
            const ptList = [];
            for (let i = 0; i < numPoints; i++) {
              const angle = (i * 2 * Math.PI) / numPoints;
              const px = Math.round(centerPt.x + rad * Math.cos(angle));
              const py = Math.round(centerPt.y + (rad * 0.85) * Math.sin(angle));
              ptList.push(px + ',' + py);
            }
            pts = ptList.join(' ');
            cx = centerPt.x;
            cy = centerPt.y;
          } else {
            pts = '300,300 350,290 370,340 310,350';
          }

          const newZoneObj = {
            id: nombre.toLowerCase().replace(/\s+/g, '-'),
            name: nombre,
            nombreKey: nombre.toLowerCase(),
            color: '#f97316',
            keywords: keywords || nombre.toLowerCase(),
            pts: pts,
            cx: cx,
            cy: cy
          };

          MONITOREO_ZONAS_GEO.push(newZoneObj);
          ZONAS_COBERTURA_13.push({
            id: newZoneObj.id,
            nombre: nombre,
            sectores: keywords || nombre

          selectedMonitoreoZona = nombre;
          geoToolMode = 'edit_vertices';

        const wrapRadius = document.getElementById('wrap-zona-radius');

              wrapRadius.style.display = 'none';
            } else if (selMode.value === 'radius') {
              wrapTemplate.style.display = 'none';
              wrapRadius.style.display = 'block';
            } else {
              wrapTemplate.style.display = 'none';
              wrapRadius.style.display = 'none';
            }
          });
        }

        if (selTemplate) {
          selTemplate.addEventListener('change', () => {
            const tmpl = expansionTemplates.find(t => t.name === selTemplate.value);
            if (tmpl) {
              inpNombre.value = tmpl.name;
              txtKeywords.value = tmpl.keywords;
            }
          });

    function openModalDividirZona(zonaName) {
      const zObj = MONITOREO_ZONAS_GEO.find(z => z.name === zonaName);
      if (!zObj) return;

      const body = '<p class="modal-desc">Dividirás la zona <strong>' + zObj.name + '</strong> en dos sub-zonas operativas independientes para distribuir mejor las entregas.</p>' +
        '<div class="grid-2">' +
        '<div class="field"><label>Nombre Sub-zona A</label><input id="split-zona-a" value="' + zObj.name + ' Norte"/></div>' +
        '<div class="field"><label>Nombre Sub-zona B</label><input id="split-zona-b" value="' + zObj.name + ' Sur"/></div>' +
        '</div>' +
        '<div class="field"><label>Criterio de partición</label><select class="select" id="split-criterio">' +
        '<option>Partición transversal (Norte / Sur)</option>' +
        '<option>Partición longitudinal (Oriente / Occidente)</option>' +
        '<option>Trazar línea de corte personalizada en el mapa</option>' +
        '</select></div>';

      openModal(
        'Dividir polígono de cobertura — ' + zObj.name,

          const nameA = document.getElementById('split-zona-a').value.trim() || (zObj.name + ' A');
          const nameB = document.getElementById('split-zona-b').value.trim() || (zObj.name + ' B');

          const origPts = zObj.pts.trim().split(/\s+/);
          const half = Math.floor(origPts.length / 2);
          const ptsA = origPts.slice(0, half + 1).join(' ') + ' ' + origPts[0];
          const ptsB = origPts.slice(half).join(' ') + ' ' + origPts[0];

          zObj.name = nameA;
          zObj.pts = ptsA;

          const newZoneB = {
            id: nameB.toLowerCase().replace(/\s+/g, '-'),
            name: nameB,
            nombreKey: nameB.toLowerCase(),
            color: '#f97316',
            keywords: zObj.keywords,
            pts: ptsB,
            cx: zObj.cx + 10,
            cy: zObj.cy + 15
          };
          MONITOREO_ZONAS_GEO.push(newZoneB);

          toast('Zona dividida en ' + nameA + ' y ' + nameB + ' exitosamente.');
          selectedMonitoreoZona = nameA;

          const content = document.getElementById('content');
          if (content && currentRoute === 'monitoreo') {
            content.innerHTML = R['monitoreo']();
            attachRowActions(content);
            attachMonitoreoScreenEvents(content);
          }
        },
        null,
        '480px'

    function attachMonitoreoScreenEvents(container) {
      // 1. Pestañas GPS / Cobertura
      const tabGps = container.querySelector('#tab-monitoreo-gps');
      const tabCob = container.querySelector('#tab-monitoreo-cobertura');

      if (tabGps) {
        tabGps.addEventListener('click', () => {
          monitoreoTab = 'gps';
          refreshMap();
        });
      }

      if (tabCob) {
        tabCob.addEventListener('click', () => {
          monitoreoTab = 'cobertura';
          refreshMap();
        });
      }

      // 2. Toggles de capas de mapa real
      const chkStreets = container.querySelector('#chk-base-streets');
      const chkMetro = container.querySelector('#chk-base-metro');
      const chkLandmarks = container.querySelector('#chk-base-landmarks');

      if (chkStreets) chkStreets.addEventListener('change', (e) => { showBaseMapStreets = e.target.checked; refreshMap(); });
      if (chkMetro) chkMetro.addEventListener('change', (e) => { showBaseMapMetro = e.target.checked; refreshMap(); });
      if (chkLandmarks) chkLandmarks.addEventListener('change', (e) => { showBaseMapLandmarks = e.target.checked; refreshMap(); });

      // 3. Herramientas GIS
      const toolSelect = container.querySelector('#tool-select');
      const toolEditV = container.querySelector('#tool-edit-vertices');
      const toolDraw = container.querySelector('#tool-draw');
      const toolSplit = container.querySelector('#tool-split');

      if (toolSelect) toolSelect.addEventListener('click', () => { geoToolMode = 'select'; refreshMap(); });
      if (toolEditV) toolEditV.addEventListener('click', () => { geoToolMode = 'edit_vertices'; refreshMap(); });
      if (toolDraw) toolDraw.addEventListener('click', () => { geoToolMode = 'draw'; activeDrawingPoints = []; refreshMap(); });
      if (toolSplit) toolSplit.addEventListener('click', () => { geoToolMode = 'split'; splitPoints = []; refreshMap(); });

      function refreshMap() {
        const content = document.getElementById('content');
        if (content && currentRoute === 'monitoreo') {
          content.innerHTML = R['monitoreo']();
          attachRowActions(content);
          attachMonitoreoScreenEvents(content);
        }
      }

      // Helper para convertir coordenadas de evento del mouse / touch a coordenadas reales del mundo SVG
      const viewport = container.querySelector('#map-svg-viewport');
      const svgMap = container.querySelector('#medellin-svg-map');

      function getMapWorldCoords(clientX, clientY) {
        if (!svgMap) return { x: 0, y: 0 };
        const rect = svgMap.getBoundingClientRect();
        const svgBoxX = ((clientX - rect.left) / rect.width) * 680;
        const svgBoxY = ((clientY - rect.top) / rect.height) * 820;
        const worldX = Math.round((svgBoxX - mapPanX) / mapZoomLevel);
        const worldY = Math.round((svgBoxY - mapPanY) / mapZoomLevel);
        return { x: worldX, y: worldY };
      }

      // 4. Navegación Táctil y con Mouse (Pan & Zoom Universal)
      if (viewport) {
        // Arrastre con Pointer Events (Mouse, Touch y Pen)
        viewport.addEventListener('pointerdown', (e) => {
          // Si estamos en modo de trazar o sobre un vértice, no arrastramos el mapa
          if (e.target.closest('.geo-vertex-handle') || geoToolMode === 'draw') return;

          isMapDragging = true;
          dragStartX = e.clientX - mapPanX;
          dragStartY = e.clientY - mapPanY;
          viewport.style.cursor = 'grabbing';
          viewport.setPointerCapture(e.pointerId);
        });

        viewport.addEventListener('pointermove', (e) => {
          if (!isMapDragging) return;
          mapPanX = e.clientX - dragStartX;
          mapPanY = e.clientY - dragStartY;

          const worldLayer = svgMap ? svgMap.querySelector('#map-world-layer') : null;
          if (worldLayer) {
            worldLayer.setAttribute('transform', 'translate(' + mapPanX + ', ' + mapPanY + ') scale(' + mapZoomLevel + ')');
          }
        });

        const stopDrag = (e) => {
          if (isMapDragging) {
            isMapDragging = false;
            viewport.style.cursor = (geoToolMode === 'draw' ? 'crosshair' : 'grab');
            try { viewport.releasePointerCapture(e.pointerId); } catch (err) { }
          }
        };

        viewport.addEventListener('pointerup', stopDrag);
        viewport.addEventListener('pointercancel', stopDrag);

        // Zoom suave con Rueda del Mouse
        viewport.addEventListener('wheel', (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
          const newZoom = Math.min(4.0, Math.max(0.6, mapZoomLevel * zoomFactor));

          const rect = svgMap.getBoundingClientRect();
          const mouseSvgX = ((e.clientX - rect.left) / rect.width) * 680;
          const mouseSvgY = ((e.clientY - rect.top) / rect.height) * 820;

          // Ajustar Pan para que el zoom sea centrado en el cursor del mouse
          mapPanX = mouseSvgX - (mouseSvgX - mapPanX) * (newZoom / mapZoomLevel);
          mapPanY = mouseSvgY - (mouseSvgY - mapPanY) * (newZoom / mapZoomLevel);
          mapZoomLevel = newZoom;

          refreshMap();
        }, { passive: false });
      }

      // 5. Clic sobre el mapa para trazar nuevo polígono (Modo Draw)
      if (svgMap && geoToolMode === 'draw') {
        svgMap.addEventListener('click', (e) => {
          const coords = getMapWorldCoords(e.clientX, e.clientY);
          activeDrawingPoints.push(coords);
          refreshMap();
        });
      }

      // 6. Botón Cerrar y Guardar Trazado
      const btnCerrarTrazado = container.querySelector('#btn-cerrar-trazado');
      if (btnCerrarTrazado) {
        btnCerrarTrazado.addEventListener('click', () => {
          if (activeDrawingPoints.length < 3) return;
          const ptsStr = activeDrawingPoints.map(p => p.x + ',' + p.y).join(' ');
          const avgX = Math.round(activeDrawingPoints.reduce((acc, p) => acc + p.x, 0) / activeDrawingPoints.length);
          const avgY = Math.round(activeDrawingPoints.reduce((acc, p) => acc + p.y, 0) / activeDrawingPoints.length);

          const newName = 'Zona ' + (MONITOREO_ZONAS_GEO.length + 1);
          MONITOREO_ZONAS_GEO.push({
            id: 'zona-' + (MONITOREO_ZONAS_GEO.length + 1),
            name: newName,
            nombreKey: newName.toLowerCase(),
            color: '#f97316',
            keywords: newName.toLowerCase(),
            pts: ptsStr,
            cx: avgX,
            cy: avgY
          });

          toast('Polígono cerrado y guardado como ' + newName);
          geoToolMode = 'select';
          selectedMonitoreoZona = newName;
          activeDrawingPoints = [];
          refreshMap();
        });
      }

      const btnCancelarTrazado = container.querySelector('#btn-cancelar-trazado');
      if (btnCancelarTrazado) {
        btnCancelarTrazado.addEventListener('click', () => {
          activeDrawingPoints = [];
          geoToolMode = 'select';
          refreshMap();
        });
      }

      // 7. Arrastre / Clic en Nodos de Vértice en modo Edit Vertices
      container.querySelectorAll('.geo-vertex-handle').forEach(handle => {
        handle.addEventListener('click', (e) => {
          e.stopPropagation();
          const vIdx = parseInt(handle.dataset.vidx, 10);
          selectedVertexIndex = vIdx;
          toast('Vértice #' + (vIdx + 1) + ' seleccionado. Haz clic en el mapa sobre la calle deseada para moverlo.');
          refreshMap();
        });
      });

      // Si hay un vértice seleccionado y se hace clic en el mapa en modo edit_vertices, se mueve con precisión
      if (svgMap && geoToolMode === 'edit_vertices' && selectedVertexIndex !== null) {
        svgMap.addEventListener('click', (e) => {
          if (e.target.classList.contains('geo-vertex-handle')) return;
          const coords = getMapWorldCoords(e.clientX, e.clientY);

          const zObj = MONITOREO_ZONAS_GEO.find(z => z.name === selectedMonitoreoZona);
          if (zObj && selectedVertexIndex !== null) {
            const ptArr = zObj.pts.trim().split(/\s+/);
            ptArr[selectedVertexIndex] = coords.x + ',' + coords.y;
            zObj.pts = ptArr.join(' ');
            toast('Vértice #' + (selectedVertexIndex + 1) + ' ajustado a ' + coords.x + ',' + coords.y);
            selectedVertexIndex = null;
            refreshMap();
          }
        });
      }

      // 8. Click en Polígono de Zona en el mapa
      container.querySelectorAll('.map-zone-polygon').forEach(poly => {
        poly.addEventListener('click', (e) => {
          if (geoToolMode === 'draw') return;
          const zName = poly.dataset.zoneName;
          if (zName) {
            selectedMonitoreoZona = zName;
            if (monitoreoTab !== 'cobertura') monitoreoTab = 'cobertura';
            refreshMap();
          }
        });
      });

      // 9. Click en Marcador de Domiciliario en el mapa
      container.querySelectorAll('.map-rider-marker').forEach(marker => {
        marker.addEventListener('click', () => {
          const rId = marker.dataset.riderId;
          if (rId) {
            selectedMonitoreoDomId = rId;
            monitoreoTab = 'gps';
            refreshMap();
          }
        });
      });

      // 10. Selector de rider en el inspector GPS
      const selRider = container.querySelector('#sel-rider-focus');
      if (selRider) {
        selRider.addEventListener('change', (e) => {
          selectedMonitoreoDomId = e.target.value;
          refreshMap();
        });
      }

      // 11. Selector de zona en el inspector de cobertura
      const selZona = container.querySelector('#sel-cobertura-zona');
      if (selZona) {
        selZona.addEventListener('change', (e) => {
          selectedMonitoreoZona = e.target.value;
          refreshMap();
        });
      }

      // 12. Botón Modal Agregar Nueva Zona
      const btnNuevaZona = container.querySelector('#btn-modal-nueva-zona');
      if (btnNuevaZona) btnNuevaZona.addEventListener('click', openModalAgregarZona);

      // 13. Botón Dividir Zona
      const btnDividirZona = container.querySelector('#btn-dividir-zona-directo');
      if (btnDividirZona) {
        btnDividirZona.addEventListener('click', () => {
          openModalDividirZona(btnDividirZona.dataset.zona);
        });
      }

      // 14. Botón Eliminar Zona
      const btnEliminarZona = container.querySelector('#btn-eliminar-zona');
      if (btnEliminarZona) {
        btnEliminarZona.addEventListener('click', () => {
          const zName = btnEliminarZona.dataset.zona;
          if (MONITOREO_ZONAS_GEO.length <= 1) {
            toast('Debe existir al menos una zona de cobertura');
            return;
          }
          const idx = MONITOREO_ZONAS_GEO.findIndex(z => z.name === zName);
          if (idx !== -1) {
            MONITOREO_ZONAS_GEO.splice(idx, 1);
            selectedMonitoreoZona = MONITOREO_ZONAS_GEO[0].name;
            toast('Zona ' + zName + ' eliminada del mapa de cobertura.');
            refreshMap();
          }
        });
      }

      // 15. Botón Guardar Cobertura
      const btnGuardarCob = container.querySelector('#btn-guardar-cobertura');
      if (btnGuardarCob) {
        btnGuardarCob.addEventListener('click', () => {
          const zName = btnGuardarCob.dataset.zona;
          const keywords = container.querySelector('#edit-zona-keywords').value;
          const zObj = ZONAS_COBERTURA_13.find(z => z.nombre === zName);
          if (zObj) {
            zObj.sectores = keywords;
            toast('Sectores y polígono para ' + zName + ' guardados exitosamente.');
          }
        });
      }

      // 16. Botón Exportar GeoJSON
      const btnGeoJson = container.querySelector('#btn-descargar-geojson');
      if (btnGeoJson) {
        btnGeoJson.addEventListener('click', () => {
          toast('cobertura.json generado con los polígonos y calles actualizados.');
        });
      }

      // 17. Botón Contactar Domiciliario
      const btnContactar = container.querySelector('.btn-contactar-dom');
      if (btnContactar) {
        btnContactar.addEventListener('click', () => {
          openModal(
            'Mensaje de radio / despacho — ' + btnContactar.dataset.rider,
            '<div class="field"><label>Mensaje prioritario</label><textarea rows="3">Por favor confirmar entrega en portería antes de seguir a la siguiente parada.</textarea></div>',
            'Transmitir mensaje',
            () => toast('Mensaje enviado al terminal móvil del repartidor.')
          );
        });
      }

      // 18. Controles de Zoom del Mapa
      const btnZoomIn = container.querySelector('#btn-map-zoom-in');
      const btnZoomOut = container.querySelector('#btn-map-zoom-out');
      const btnReset = container.querySelector('#btn-map-reset');

      if (btnZoomIn) {
        btnZoomIn.addEventListener('click', () => {
          mapZoomLevel = Math.min(4.0, mapZoomLevel + 0.25);
          refreshMap();
        });
      }

      if (btnZoomOut) {
        btnZoomOut.addEventListener('click', () => {
          mapZoomLevel = Math.max(0.6, mapZoomLevel - 0.25);
          refreshMap();
        });
      }

      if (btnReset) {
        btnReset.addEventListener('click', () => {
          mapZoomLevel = 1.0;
          mapPanX = 0;
          mapPanY = 0;
          refreshMap();
        });
      }
    }

        '<div class="field"><label>Correo institucional</label><input id="login-email" type="email" placeholder="nombre@jacksoft.co" value="marta@jacksoft.co"/></div>' +
        '<div class="field"><label>Contraseña</label><input id="login-pass" type="password" placeholder="••••••••" value="12345678"/></div>' +
        '<div style="display:flex;justify-content:flex-end;margin-bottom:18px"><a href="#" style="font-size:12px;color:var(--accent);font-weight:600" id="forgot-link">¿Olvidaste tu contraseña?</a></div>' +
        '<div id="login-error" style="display:none;margin-bottom:14px" class="alert alert-info"></div>' +
        '<button class="btn btn-primary" style="width:100%;justify-content:center;height:40px" id="login-btn">Acceder al panel</button>' +
        '<p style="text-align:center;font-size:11px;color:var(--ink-400);margin-top:20px">Acceso exclusivo para personal operativo y administrativo.</p>' +
        '</div></div>' +
        '</div>' +
        '<div id="toast-wrap"></div><div id="modal-wrap"><div class="modal-box" id="modal-box"></div></div>';

      document.getElementById('login-btn').addEventListener('click', () => { bootApp(); });
      document.getElementById('forgot-link').addEventListener('click', (e) => {
        e.preventDefault();
        const err = document.getElementById('login-error');
        err.style.display = 'flex';
        err.style.gap = '9px';
        err.style.alignItems = 'flex-start';
        err.innerHTML = ic('mail', 16) + '<span>Enlace de recuperación enviado a marta@jacksoft.co (válido por 30 minutos).</span>';
      });
    }

    /* ============================= ROUTER & BOOTSTRAP ============================= */
    /* Actualiza solo el interior del analytics-station sin re-renderizar la página */
    function updateAnalyticsInPlace() {
      const metricObj = ANALYTICS_DATA[currentAnalyticsMetric] || ANALYTICS_DATA.ventas;
      const timeObj = metricObj[currentAnalyticsTime] || metricObj.semana;

      // 1. Actualizar clases activas de las píldoras de métrica
      document.querySelectorAll('.metric-pill').forEach(p => {
        const isActive = p.dataset.metric === currentAnalyticsMetric;
        p.classList.toggle('active', isActive);
        const valEl = p.querySelector('.val');
        const lblEl = p.querySelector('.lbl');
        if (valEl) valEl.style.color = isActive ? 'var(--accent)' : '';
        if (lblEl) lblEl.style.color = isActive ? 'var(--ink-900)' : '';
      });

      // 2. Actualizar clases activas de los botones de tiempo
      document.querySelectorAll('.time-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.time === currentAnalyticsTime);
      });

      // 3. Animar la salida del bloque de datos
      const chartBody = document.getElementById('analytics-chart-body');
      if (!chartBody) return;
      chartBody.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
      chartBody.style.opacity = '0';
      chartBody.style.transform = 'translateY(6px)';

      setTimeout(() => {
        // Actualizar números principales
        const bigNum = document.getElementById('chart-big-num');
        const deltaBadge = document.getElementById('chart-delta-badge');
        const metaAvg = document.getElementById('chart-meta-avg');
        const metaNote = document.getElementById('chart-meta-note');
        const svgContainer = document.getElementById('svg-chart-container');

        if (bigNum) bigNum.textContent = timeObj.mainVal;
        if (deltaBadge) {
          deltaBadge.textContent = timeObj.delta;
          deltaBadge.className = 'chart-delta-badge ' + timeObj.tone;
        }
        if (metaAvg) metaAvg.textContent = timeObj.avg;
        if (metaNote) metaNote.textContent = timeObj.note;
        if (svgContainer) svgContainer.innerHTML = renderDynamicSvgChart(timeObj.points, timeObj.type);

        // Animar la entrada
        chartBody.style.opacity = '1';
        chartBody.style.transform = 'translateY(0)';
      }, 180);
    }

    function attachDashboardAnalyticsEvents(container) {
      // Eventos de selección de métricas — actualización in-place
      container.querySelectorAll('.metric-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          if (currentAnalyticsMetric === pill.dataset.metric) return;
          currentAnalyticsMetric = pill.dataset.metric;
          updateAnalyticsInPlace();
        });
      });

      // Eventos de filtro temporal — actualización in-place
      container.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (currentAnalyticsTime === btn.dataset.time) return;
          currentAnalyticsTime = btn.dataset.time;
          updateAnalyticsInPlace();
        });
      });
    }

    function navigate(route) {
      currentRoute = route;
      if (window.innerWidth <= 992) {
        const sb = document.getElementById('sidebar');
        const bd = document.getElementById('sidebar-backdrop');
        if (sb) sb.classList.remove('mobile-open');
        if (bd) bd.classList.remove('active');
      }
      renderSidebar();
      renderTopbar();
      const content = document.getElementById('content');
      content.style.opacity = '0';
      setTimeout(() => {
        content.innerHTML = R[route] ? R[route]() : '<div class="view">Módulo en construcción.</div>';
        content.style.opacity = '1';
        attachRowActions(content);

        content.querySelectorAll('.hub-link').forEach(btn => {
          btn.addEventListener('click', () => navigate(btn.dataset.route));
        });

        if (route === 'home') {
          attachDashboardAnalyticsEvents(content);
        }

        if (route === 'roles') {
          const box = document.getElementById('content');
          box.querySelectorAll('[data-act="rol-toggle"]').forEach(btn => {
            btn.addEventListener('click', () => {
              const rol = getRol(btn.dataset.rol);
              if (!rol) return;
              rol.estado = rol.estado === 'Activo' ? 'Inactivo' : 'Activo';
              btn.classList.toggle('on');
              const txt = btn.nextElementSibling;
              if (txt) txt.textContent = rol.estado;
              const tr = btn.closest('tr');
              if (tr) tr.dataset.estado = rol.estado;
              toast('Estado del rol ' + rol.nombre + ' actualizado a ' + rol.estado);
            });
          });
        }

        if (route === 'permisos') {
          const box = document.getElementById('content');
          const modulo = box.querySelector('[data-filter-permiso-modulo]');
          const estado = box.querySelector('[data-filter-permiso-estado]');
          const rows = box.querySelectorAll('tbody tr[data-permiso-modulo]');
          const apply = () => {
            rows.forEach(row => {
              const visible = (!modulo.value || row.dataset.permisoModulo === modulo.value) &&
                (!estado.value || row.dataset.permisoEstado === estado.value);
              row.style.display = visible ? '' : 'none';
            });
          };
          const filterButton = box.querySelector('[data-msg="Filtros aplicados"]');
          if (filterButton) filterButton.addEventListener('click', apply);

          box.querySelectorAll('[data-act="permiso-toggle"]').forEach(btn => {
            btn.addEventListener('click', () => {
              const row = btn.closest('tr');
              const nuevoEstado = row.dataset.permisoEstado === 'Activo' ? 'Inactivo' : 'Activo';
              row.dataset.permisoEstado = nuevoEstado;
              btn.classList.toggle('on', nuevoEstado === 'Activo');
              const txt = btn.nextElementSibling;
              if (txt) txt.textContent = nuevoEstado;
              toast('Estado del permiso actualizado a ' + nuevoEstado);
            });
          });
        }

        if (route === 'usuarios') {
          const box = document.getElementById('content');
          const rol = box.querySelector('[data-filter-usuario-rol]');
          const estado = box.querySelector('[data-filter-usuario-estado]');
          const rows = box.querySelectorAll('tbody tr[data-usuario-rol]');
          const apply = () => {
            rows.forEach(row => {
              const visible = (!rol.value || row.dataset.usuarioRol === rol.value) &&
                (!estado.value || row.dataset.usuarioEstado === estado.value);
              row.style.display = visible ? '' : 'none';
            });
          };
          const filterButton = box.querySelector('[data-act="filter-usuarios"]');
          if (filterButton) filterButton.addEventListener('click', () => {
            apply();
            toast('Filtros de usuarios aplicados');
          });
          box.querySelectorAll('[data-act="usuario-toggle"]').forEach(btn => {
            btn.addEventListener('click', () => {
              const row = btn.closest('tr');
              const nuevoEstado = row.dataset.usuarioEstado === 'Activo' ? 'Inactivo' : 'Activo';
              row.dataset.usuarioEstado = nuevoEstado;
              btn.classList.toggle('on', nuevoEstado === 'Activo');
              const txt = btn.nextElementSibling;
              if (txt) txt.textContent = nuevoEstado;
              toast('Estado del usuario actualizado a ' + nuevoEstado);
            });
          });
        }

        if (route === 'produccion') {
          const box = document.getElementById('content');
          const view = box.querySelector('[data-production-view]');
          const period = box.querySelector('[data-production-period]');
          const status = box.querySelector('[data-production-status]');
          const rows = box.querySelectorAll('tbody tr[data-production-status]');
          const apply = () => {
            rows.forEach(row => {
              row.style.display = !status.value || row.dataset.productionStatus === status.value ? '' : 'none';
            });
          };
          if (status) status.addEventListener('change', apply);
          if (view) view.addEventListener('change', () => toast(view.value + ' de producción seleccionada'));
          if (period) period.addEventListener('change', () => toast('Período de producción actualizado'));
        }

        if (route === 'fichas') {
          const selector = document.getElementById('ficha-selector');
          const title = document.getElementById('ficha-detail-title');
          const ingredients = document.getElementById('ficha-ingredients');
          const procedure = document.getElementById('ficha-procedure');
          const recipes = {
            'Sopa de lentejas': { ingredients: ['Lentejas — 80 g', 'Papa — 100 g', 'Zanahoria — 40 g', 'Cebolla — 20 g', 'Caldo — 250 ml', 'Aceite — 5 ml'], procedure: 'Lavar las lentejas. Cocinar con papa, zanahoria y cebolla hasta alcanzar la textura definida. Ajustar sal y porcionar 250 ml por cliente.' },
            'Ensalada de lechuga': { ingredients: ['Lechuga — 80 g', 'Tomate — 50 g', 'Zanahoria — 30 g', 'Vinagreta — 20 ml'], procedure: 'Lavar y desinfectar los vegetales. Cortar, mezclar y porcionar la ensalada para una persona.' },
            'Carne molida': { ingredients: ['Carne molida — 120 g', 'Tomate — 40 g', 'Cebolla — 20 g', 'Aceite — 5 ml'], procedure: 'Sofreír los vegetales, agregar la carne y cocinar hasta alcanzar la preparación definida.' },
            'Arroz con coco': { ingredients: ['Arroz — 90 g', 'Leche de coco — 80 ml', 'Coco rallado — 15 g', 'Sal — 2 g'], procedure: 'Preparar la base de coco, incorporar el arroz y cocinar hasta obtener una porción lista.' },
            'Jugo de mora': { ingredients: ['Mora — 100 g', 'Agua — 250 ml', 'Azúcar — 10 g'], procedure: 'Lavar la fruta, licuar con agua, colar y servir una porción de 250 ml.' }
          };
          if (selector) selector.addEventListener('change', () => {
            const recipe = recipes[selector.value];
            if (!recipe) return;
            title.textContent = selector.value;
            ingredients.innerHTML = recipe.ingredients.map(item => '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line-soft)">' + item + '</div>').join('');
            procedure.textContent = recipe.procedure;
          });
        }

        if (route === 'suscripciones') {
          attachSuscripcionesScreenEvents(content);
        }

        if (route === 'clientes') {
          attachClientesScreenEvents(content);
        }

        if (route === 'domiciliarios' || route === 'rutas') {
          attachDomiciliariosScreenEvents(content);
        }

        if (route === 'monitoreo') {
          attachMonitoreoScreenEvents(content);
        }
      }, 60);
    }

    function bootApp() {
      document.body.innerHTML =
        '<div id="sidebar-backdrop"></div>' +
        '<div id="app">' +
        '<aside id="sidebar"></aside>' +
        '<div id="main">' +
        '<header id="topbar"></header>' +
        '<main id="content"></main>' +
        '</div>' +
        '</div>' +
        '<div id="toast-wrap"></div>' +
        '<div id="modal-wrap"><div class="modal-box" id="modal-box"></div></div>';

      const bd = document.getElementById('sidebar-backdrop');
      if (bd) {
        bd.addEventListener('click', () => {
          const sb = document.getElementById('sidebar');
          if (sb) sb.classList.remove('mobile-open');
          bd.classList.remove('active');
        });
      }

      document.getElementById('modal-wrap').addEventListener('click', e => {
        if (e.target.id === 'modal-wrap') e.currentTarget.classList.remove('open');
      });

      currentRoute = 'home';
      renderSidebar();
      renderTopbar();
      document.getElementById('content').innerHTML = R['home']();
      attachRowActions(document.getElementById('content'));
      attachDashboardAnalyticsEvents(document.getElementById('content'));

      document.getElementById('content').querySelectorAll('.hub-link').forEach(btn => {
        btn.addEventListener('click', () => navigate(btn.dataset.route));
      });
    }

    // Inicializar aplicación
    renderLogin();
  </script>
</body>
