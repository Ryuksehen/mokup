<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JackSoft — Sistema de Gestión Administrativa y Operativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Paleta Oficial BrandBook 'La Coca de Jacks' 2026 */
      --brand-orange: #F2641A;
      --brand-orange-hover: #D64E09;
      --brand-orange-light: #FF7F38;
      --brand-carbon: #2B2118;
      --brand-carbon-soft: #564539;
      --brand-crema: #FFF6EA;
      --brand-crema-soft: #FFECCC;
      --brand-beige: #F0E2C8;
      --brand-gris-calido: #C7BBA8;
      --brand-beige-gris: #A9A08D;
      --brand-verde: #92CB94;
      --brand-verde-deep: #5E8D62;
      --brand-verde-soft: #DCEEDD;
      --brand-amarillo: #FFC857;
      --brand-amarillo-pale: #FFE3A8;
      --brand-amarillo-intenso: #E0A52E;

      /* Base y Contenedores */
      --bg: #FAF6F0;
      --card: #FFFFFF;
      --card-subtle: #FFF9F2;
      --line: #EFE6D8;
      --line-soft: #F7F1E6;

      /* Tipografía de Alto Contraste (Carbón y Neutros Cálidos) */
      --ink-900: #2B2118;
      --ink-700: #564539;
      --ink-500: #857567;
      --ink-400: #A9A08D;
      --ink-300: #D8CEBE;

      /* Sidebar y Paneles Oscuros en Carbón Institucional (#2B2118) */
      --sidebar-bg: #2B2118;
      --sidebar-border: #3E3024;
      --sidebar-hover: #3A2D22;
      --sidebar-text: #FFF6EA;
      --sidebar-muted: #C7BBA8;

      /* Acento Naranja Oficial (#F2641A) */
      --accent: #F2641A;
      --accent-hover: #D64E09;
      --accent-light: #FF7F38;
      --accent-soft: #FFEDD5;
      --accent-bg: #FFF6EA;
      --accent-border: #F0E2C8;

      /* Estados y Badges Funcionales */
      --green-600: #5E8D62;
      --green-500: #92CB94;
      --green-100: #DCEEDD;

      --yellow-600: #E0A52E;
      --yellow-500: #FFC857;
      --yellow-100: #FFE3A8;

      --red-600: #C23824;
      --red-500: #E64936;
      --red-100: #FDE8E6;

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 3px rgba(43, 33, 24, 0.05);
      --shadow-md: 0 4px 12px rgba(43, 33, 24, 0.07), 0 1px 3px rgba(43, 33, 24, 0.04);
      --shadow-lg: 0 12px 24px rgba(43, 33, 24, 0.09), 0 4px 8px rgba(43, 33, 24, 0.04);

      --mono: 'JetBrains Mono', monospace;
      --display: 'Baloo 2', -apple-system, BlinkMacSystemFont, sans-serif;
      --body: 'Work Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      text-transform: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink-900);
      font-family: var(--body);
      font-size: 13.5px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4,
    h5 {
      font-family: var(--display);
      margin: 0;
      color: var(--ink-900);
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    p {
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: var(--body);
      cursor: pointer;
      border: none;
      outline: none;
    }

    ::selection {
      background: #FED7AA;
      color: #9A3412;
    }

    /* ---------- Layout Shell ---------- */
    #app {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- Sidebar Compacto & Limpio ---------- */
    #sidebar {
      width: 275px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      transition: width 0.2s ease;
      z-index: 40;
      border-right: 1px solid var(--sidebar-border);
    }

    #sidebar.collapsed {
      width: 68px;
    }

    #sidebar.collapsed .brand {
      padding: 14px 0;
      justify-content: center;
    }

    #sidebar.collapsed .brand-mark {
      margin: 0 auto;
    }

    #sidebar.collapsed .brand-text {
      display: none !important;
    }

    #sidebar.collapsed .nav-scroll {
      padding: 10px 6px;
    }

    #sidebar.collapsed .nav-home-btn {
      padding: 9px 0;
      justify-content: center;
      gap: 0;
    }

    #sidebar.collapsed .nav-home-btn .nav-label {
      display: none !important;
    }

    #sidebar.collapsed .nav-home-btn .nav-icon {
      margin: 0 auto;
    }

    #sidebar.collapsed .nav-demo-box,
    #sidebar.collapsed .nav-footer {
      display: none !important;
    }

    #sidebar::-webkit-scrollbar {
      width: 4px;
    }

    #sidebar::-webkit-scrollbar-thumb {
      background: var(--sidebar-border);
      border-radius: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 14px 18px;
      border-bottom: 1px solid var(--sidebar-border);
      cursor: pointer;
      transition: background 0.15s ease, padding 0.2s ease;
    }

    .brand:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      flex-shrink: 0;
      background: var(--brand-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(242, 100, 26, 0.38);
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .brand:hover .brand-mark {
      transform: scale(1.04);
    }

    .brand-text {
      overflow: hidden;
      white-space: nowrap;
    }

    .brand-text .name {
      font-family: var(--display);
      font-weight: 800;
      font-size: 16px;
      color: #FFFFFF;
      line-height: 1.15;
    }

    .brand-text .sub {
      font-size: 10.5px;
      color: var(--sidebar-muted);
      margin-top: 1px;
      font-weight: 500;
    }

    .nav-scroll {
      padding: 10px 10px 14px 10px;
      flex: 1;
    }

    /* Botón permanente de Dashboard */
    .nav-home-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--sidebar-text);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      margin-bottom: 6px;
      transition: all 0.15s ease;
    }

    .nav-home-btn:hover {
      background: var(--sidebar-hover);
      color: #FFFFFF;
    }

    .nav-home-btn.active {
      background: #FFFFFF;
      color: var(--ink-900);
      font-weight: 700;
    }

    .nav-home-btn.active .nav-icon {
      color: var(--accent);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--sidebar-muted);
    }

    .nav-divider {
      height: 1px;
      background: var(--sidebar-border);
      margin: 6px 4px 8px 4px;
    }

    /* Macro-grupos con apertura suave */
    .macro-group {
      margin-bottom: 3px;
    }

    .macro-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--sidebar-text);
      font-size: 12.8px;
      font-weight: 600;
      text-align: left;
      transition: all 0.14s ease;
      cursor: pointer;
    }

    .macro-btn:hover {
      background: var(--sidebar-hover);
      color: #FFFFFF;
    }

    .macro-btn.open {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.04);
    }

    .macro-btn.active-parent {
      color: #FFFFFF;
      font-weight: 700;
    }

    .macro-ic {
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--sidebar-muted);
    }

    .macro-btn.active-parent .macro-ic {
      color: var(--accent-light);
    }

    .macro-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .macro-count {
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--sidebar-border);
      color: var(--sidebar-muted);
    }

    .macro-chev {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      transition: transform 0.18s ease;
      opacity: 0.55;
    }

    .macro-btn.open .macro-chev {
      transform: rotate(180deg);
      opacity: 1;
    }

    #sidebar.collapsed .macro-label,
    #sidebar.collapsed .macro-count,
    #sidebar.collapsed .macro-chev {
      display: none;
    }

    #sidebar.collapsed .macro-btn {
      justify-content: center;
      padding: 9px 0;
    }

    .macro-sub {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      padding-left: 6px;
    }

    .macro-btn.open+.macro-sub {
      max-height: 380px;
    }

    #sidebar.collapsed .macro-sub {
      display: none;
    }

    .subproceso-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--sidebar-muted);
      padding: 6.5px 8px 6.5px 22px;
      font-size: 12.3px;
      border-radius: var(--radius-sm);
      position: relative;
      transition: all 0.12s ease;
      font-weight: 500;
    }

    .subproceso-item:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.05);
    }

    .subproceso-item.active {
      color: #FFFFFF;
      background: rgba(234, 88, 12, 0.18);
      font-weight: 600;
    }

    .subproceso-ic {
      width: 15px;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--sidebar-muted);
    }

    .subproceso-item.active .subproceso-ic {
      color: var(--accent-light);
    }

    .subproceso-item.active::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-light);
    }

    /* Enlaces Demo de presentación */
    .nav-demo-box {
      margin: 8px 10px 10px 10px;
      padding: 9px 10px;
      background: var(--sidebar-border);
      border-radius: var(--radius-sm);
    }

    .nav-demo-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--sidebar-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-demo-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      margin-bottom: 4px;
      text-decoration: none;
      transition: opacity 0.15s ease;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-demo-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .nav-demo-btn:last-child {
      margin-bottom: 0;
    }

    .nav-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--sidebar-border);
      font-size: 11px;
      color: var(--sidebar-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #sidebar.collapsed .nav-demo-box,
    #sidebar.collapsed .nav-footer {
      display: none;
    }

    /* ---------- Main Column ---------- */
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ---------- Topbar ---------- */
    #topbar {
      height: 58px;
      flex-shrink: 0;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: var(--shadow-sm);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-500);
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
    }

    .icon-btn:hover {
      background: var(--line-soft);
      color: var(--ink-900);
    }

    .crumb-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .crumb-trail {
      font-size: 11px;
      color: var(--ink-500);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .crumb-trail a {
      color: var(--ink-700);
      font-weight: 600;
      cursor: pointer;
    }

    .crumb-trail a:hover {
      color: var(--accent);
    }

    .crumb-title {
      font-family: var(--display);
      font-weight: 800;
      font-size: 15px;
      color: var(--ink-900);
      white-space: nowrap;
    }

    .topbar-search {
      flex: 1;
      max-width: 360px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      height: 35px;
      color: var(--ink-400);
      transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .topbar-search:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: #FFFFFF;
    }

    .topbar-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 12.8px;
      width: 100%;
      color: var(--ink-900);
      font-family: var(--body);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .role-badge-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4.5px 10px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-hover);
    }

    /* Punto indicador de notificaciones importantes */
    .notif-badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: var(--red-500);
      border-radius: 50%;
      border: 1.5px solid var(--card);
      box-shadow: 0 0 4px rgba(239, 68, 68, 0.5);
    }

    .who-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .who-wrap:hover {
      background: var(--line-soft);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ink-900);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-weight: 800;
      font-size: 12px;
    }

    .who {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .who .n {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-900);
    }

    .who .r {
      font-size: 10.5px;
      color: var(--ink-500);
    }

    /* ---------- Content Main Area ---------- */
    #content {
      padding: 18px 24px 40px 24px;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      transition: opacity 0.15s ease;
    }

    .page-head-clean {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .page-head-clean h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink-900);
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ---------- Components: Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 1px 3px rgba(234, 88, 12, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-dark {
      background: var(--ink-900);
      color: #FFFFFF;
    }

    .btn-dark:hover {
      background: #000000;
    }

    .btn-ghost {
      background: #FFFFFF;
      color: var(--ink-700);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      border-color: var(--ink-400);
      color: var(--ink-900);
      background: var(--bg);
    }

    .btn-soft {
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-weight: 600;
    }

    .btn-soft:hover {
      background: var(--accent-border);
    }

    .btn-danger {
      background: var(--red-100);
      color: var(--red-600);
    }

    .btn-danger:hover {
      background: #FEE2E2;
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 11.5px;
      border-radius: 5px;
    }

    /* ---------- Components: Cards & Panels ---------- */
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      gap: 12px;
      background: #FFFFFF;
    }

    .panel-head h3 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-900);
    }

    .panel-body {
      padding: 16px;
      background: #FFFFFF;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }

    .grid-2-uneven {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 14px;
      align-items: start;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    /* ---------- Operations Hub Grid (Optimizada sin espacios muertos) ---------- */
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .hub-card {
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 105px;
      transition: all 0.15s ease;
    }

    .hub-card:hover {
      border-color: var(--accent-light);
      box-shadow: var(--shadow-md);
    }

    .hub-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 6px;
    }

    .hub-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .hub-head h4 {
      font-size: 12.5px;
      color: var(--ink-900);
      font-weight: 700;
    }

    .hub-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink-500);
      border: 1px solid var(--line);
    }

    .hub-links {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .hub-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.2px;
      padding: 3.5px 7.5px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink-700);
      border: 1px solid var(--line);
      transition: all 0.12s ease;
      font-weight: 500;
      cursor: pointer;
    }

    .hub-link:hover {
      background: var(--accent-soft);
      color: var(--accent-hover);
      border-color: var(--accent-border);
      font-weight: 600;
    }

    @media (max-width: 1100px) {
      .hub-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .hub-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- Interactive Analytics Station (Centro Unificado de Analítica) ---------- */
    .analytics-station {
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .analytics-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: #FFFFFF;
      flex-wrap: wrap;
      gap: 10px;
    }

    .analytics-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-900);
    }

    .time-filter-row {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    .time-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-500);
      background: transparent;
      transition: all 0.12s ease;
    }

    .time-btn:hover {
      color: var(--ink-900);
    }

    .time-btn.active {
      background: #FFFFFF;
      color: var(--ink-900);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    /* Selector de Métricas tipo Píldoras */
    .metric-pills-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    @media (max-width: 1050px) {
      .metric-pills-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .metric-pill {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-pill:last-child {
      border-right: none;
    }

    .metric-pill:hover {
      background: #FFFFFF;
    }

    .metric-pill.active {
      background: #FFFFFF;
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .metric-pill .lbl {
      font-size: 10.8px;
      color: var(--ink-500);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-pill.active .lbl {
      color: var(--ink-900);
      font-weight: 700;
    }

    .metric-pill .val {
      font-family: var(--display);
      font-size: 16.5px;
      font-weight: 800;
      color: var(--ink-900);
      margin-top: 2px;
    }

    .metric-pill.active .val {
      color: var(--accent);
    }

    /* Gráfico y Estadísticas de Detalle */
    .chart-body-wrap {
      padding: 18px 20px;
    }

    .chart-summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .chart-main-val {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .chart-big-number {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 800;
      color: var(--ink-900);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .chart-delta-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chart-delta-badge.up {
      background: var(--green-100);
      color: var(--green-600);
    }

    .chart-delta-badge.warn {
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    .chart-delta-badge.flat {
      background: var(--line-soft);
      color: var(--ink-500);
    }

    .chart-meta-details {
      display: flex;
      gap: 16px;
      font-size: 11.8px;
      color: var(--ink-500);
    }

    .chart-meta-item {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .chart-meta-item strong {
      color: var(--ink-900);
      font-family: var(--mono);
    }

    .svg-chart-container {
      width: 100%;
      height: 190px;
    }

    /* ---------- Sectioned Multi-Chart Analytics Grid (Debajo del gráfico principal) ---------- */
    .section-analytics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 10px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-analytics-header h3 {
      font-family: var(--display);
      font-size: 15.5px;
      font-weight: 800;
      color: var(--ink-900);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green-600);
      background: var(--green-100);
      padding: 3px 9px;
      border-radius: 12px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-600);
      box-shadow: 0 0 0 0 rgba(94, 141, 98, 0.7);
      animation: pulseLiveDot 1.8s infinite;
    }

    @keyframes pulseLiveDot {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(94, 141, 98, 0.7);
      }
      70% {
        transform: scale(1.15);
        box-shadow: 0 0 0 6px rgba(94, 141, 98, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(94, 141, 98, 0);
      }
    }

    .analytics-sections-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .analytics-sections-grid {
        grid-template-columns: 1fr;
      }
    }

    .sec-chart-card {
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .sec-chart-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-beige-gris);
    }

    .sec-chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--card-accent, var(--accent));
      opacity: 0.85;
    }

    .sec-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .sec-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-900);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .sec-card-badge {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-500);
      background: var(--bg);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
      white-space: nowrap;
    }

    .sec-kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .sec-kpi-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sec-kpi-lbl {
      font-size: 10.2px;
      color: var(--ink-500);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sec-kpi-val {
      font-family: var(--display);
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink-900);
      line-height: 1.1;
    }

    .sec-kpi-val.highlight {
      color: var(--accent);
    }

    .sec-kpi-val.green {
      color: var(--green-600);
    }

    .sec-prog-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
    }

    .sec-prog-item:last-child {
      margin-bottom: 0;
    }

    .sec-prog-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.2px;
      font-weight: 600;
      color: var(--ink-700);
    }

    .sec-prog-bar-bg {
      height: 6px;
      background: var(--line-soft);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .sec-prog-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sec-mini-svg {
      width: 100%;
      height: 80px;
      display: block;
    }

    .sec-tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .sec-tag-chip {
      font-size: 10.8px;
      padding: 3px 7px;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-700);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ---------- Tables & Toolbars ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      background: #FFFFFF;
    }

    .select {
      height: 33px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 9px;
      font-size: 12.3px;
      background: #FFFFFF;
      color: var(--ink-700);
      outline: none;
      font-family: var(--body);
    }

    .select:focus {
      border-color: var(--accent);
    }

    .provider-preview {
      position: relative;
      display: inline-block;
      color: var(--ink-700);
      border-bottom: 1px dashed var(--accent);
      cursor: help;
    }

    .provider-preview-card {
      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      width: 230px;
      padding: 11px 12px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      z-index: 25;
      white-space: normal;
      text-align: left;
    }

    .provider-preview:hover .provider-preview-card,
    .provider-preview:focus .provider-preview-card {
      display: block;
    }

    .provider-preview-card strong {
      display: block;
      color: var(--ink-900);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .provider-preview-card span {
      display: block;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.45;
    }

    .spacer {
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.8px;
      text-align: left;
      background: #FFFFFF;
    }

    th {
      background: #F8FAFC;
      color: var(--ink-700);
      font-weight: 600;
      font-size: 11.8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      position: relative;
      user-select: none;
    }

    th .th-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    th .th-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink-700);
      font-weight: 600;
      transition: color 0.12s ease;
    }

    th .th-label:hover {
      color: var(--ink-900);
    }

    th .th-sort-ic {
      font-size: 10px;
      color: var(--ink-400);
      opacity: 0.7;
    }

    th .th-filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 22px;
      padding: 0 5px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-400);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    th .th-filter-btn:hover {
      background: var(--bg);
      border-color: var(--line);
      color: var(--ink-700);
    }

    /* ==========================================================================
       INLINE EXPAND FILTER (Excel-Style Innovative UI) - BLACK & WHITE EDITORIAL
       ========================================================================== */

    /* Active Chips Bar over Table */
    .active-filters-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      border-bottom: none;
      font-size: 11.5px;
      font-family: var(--mono);
      animation: fadeInChips 0.15s ease-out;
    }

    @keyframes fadeInChips {
      from {
        opacity: 0;
        transform: translateY(-3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .active-filters-bar.has-filters {
      display: flex;
    }

    .active-chips-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .active-filters-label {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--brand-carbon);
      font-size: 11px;
      text-transform: uppercase !important;
    }

    .filter-chip-item {
      display: inline-flex;
      align-items: center;
      background: var(--brand-carbon);
      color: #FFFFFF;
      border-radius: var(--radius-sm);
      border: 1px solid var(--brand-carbon);
      font-size: 11px;
      overflow: hidden;
      font-family: var(--body);
    }

    .filter-chip-col {
      background: var(--brand-carbon-soft);
      color: var(--brand-gris-calido);
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase !important;
      letter-spacing: 0.04em;
    }

    .filter-chip-val {
      padding: 3px 8px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .filter-chip-remove {
      padding: 3px 6px;
      cursor: pointer;
      color: var(--brand-gris-calido);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      background: var(--brand-carbon-soft);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .filter-chip-remove:hover {
      background: var(--red-600);
      color: #FFFFFF;
    }

    .active-filters-count {
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-500);
      white-space: nowrap;
    }

    /* Table Grid Styling for Inline Filter */
    table {
      border-collapse: collapse;
      width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    th {
      background: #FFFFFF;
      color: var(--brand-carbon);
      border-bottom: 2px solid var(--line);
      border-right: 1px solid var(--line-soft);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase !important;
      padding: 0 !important;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    th:last-child {
      border-right: none;
    }

    th.th-actions,
    th:last-child {
      text-align: center !important;
    }

    .th-actions-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      width: 100%;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    th.th-filter-open {
      background: var(--brand-carbon) !important;
      color: #FFFFFF !important;
      border-bottom-color: var(--brand-carbon) !important;
    }

    th.th-filter-open .th-label,
    th.th-filter-open .th-filter-btn {
      color: #FFFFFF !important;
    }

    th.th-has-filter {
      border-bottom: 3px solid var(--accent);
    }

    .th-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      gap: 6px;
      width: 100%;
    }

    .th-label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: inherit;
      flex: 1;
    }

    .th-label:hover {
      opacity: 0.85;
    }

    .th-sort-ic {
      font-size: 11px;
      opacity: 0.6;
      font-family: var(--mono);
    }

    th .th-filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 20px;
      padding: 0 4px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-500);
      cursor: pointer;
      font-size: 10px;
      transition: all 0.12s ease;
    }

    th .th-filter-btn:hover {
      background: var(--bg);
      color: var(--brand-carbon);
    }

    th.th-filter-open .th-filter-btn {
      background: var(--brand-carbon-soft);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.2);
    }

    th .th-filter-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      border-color: var(--accent);
    }

    /* Inline Expand Filter Row in thead */
    tr.inline-filter-row {
      background: var(--card-subtle);
      border-bottom: 2px solid var(--line);
      animation: inlineFilterSlide 0.15s ease-out;
    }

    @keyframes inlineFilterSlide {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    tr.inline-filter-row td {
      padding: 12px 14px !important;
      border: none !important;
      background: var(--card-subtle) !important;
    }

    .inline-filter-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inline-filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .inline-filter-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-carbon);
      text-transform: uppercase !important;
      letter-spacing: 0.05em;
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inline-filter-head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inline-filter-btn-action {
      background: #FFFFFF;
      border: 1px solid var(--line);
      color: var(--ink-700);
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.1s ease;
      font-family: var(--body);
    }

    .inline-filter-btn-action:hover {
      background: var(--brand-carbon);
      border-color: var(--brand-carbon);
      color: #FFFFFF;
    }

    .inline-filter-values-grid {

      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;

      overflow-y: auto;

    .inline-value-card {
      background: #FFFFFF;
      border: 1px solid var(--line);
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-radius: var(--radius-sm);
      user-select: none;
    }

    .inline-value-card:hover {
      border-color: var(--accent-light);
      background: var(--accent-bg);
    }

    .inline-value-card.selected {
      background: var(--brand-carbon);
      border-color: var(--brand-carbon);
      color: #FFFFFF;
    }

    .inline-value-card.selected .inline-value-label,
    .inline-value-card.selected .inline-value-count {
      color: #FFFFFF !important;
    }

    .inline-value-card.selected .inline-freq-bar-fill {
      background: var(--accent) !important;
    }

    .inline-value-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .inline-value-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inline-value-count {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-500);
    }

    .inline-freq-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--line);
      border-radius: 2px;

    .inline-value-card.selected .inline-freq-bar-bg {
      background: var(--brand-carbon-soft);
    }

    .inline-freq-bar-fill {

      background: var(--accent);
      transition: width 0.2s ease;
    }

    /* Rows Dimming for Non-matching records (Innovative UI) */
    tbody tr {
      transition: opacity 0.15s ease, background 0.1s ease;
    }

    tbody tr.row-dimmed {
      opacity: 0.18 !important;
      filter: grayscale(80%);
    }

    tbody tr.row-dimmed:hover {
      opacity: 0.45 !important;
    }

    tbody tr.row-matched {
      opacity: 1 !important;
    }

    .table-dimmed-footer {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      font-size: 11.5px;
      font-family: var(--mono);
      color: var(--ink-500);
    }

    .table-dimmed-footer.has-dimmed {
      display: flex;
    }

    .btn-reset-all-dimmed {
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: var(--body);
      font-weight: 600;
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: underline;
      padding: 2px 4px;
    }

    .btn-reset-all-dimmed:hover {
      color: var(--accent-hover);
    }

    /* Botón Ver Más Registros */
    .btn-load-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      color: var(--ink-900);
      font-family: var(--body);
      font-weight: 600;
      font-size: 11.5px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
      user-select: none;
    }

    .btn-load-more:hover {
      background: var(--brand-carbon);
      border-color: var(--brand-carbon);
      color: #FFFFFF;
    }

    .btn-load-more svg {
      transition: transform 0.15s ease;
    }

    .btn-load-more:hover svg {
      transform: translateY(1px);
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--ink-700);
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #FAFAFA;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td.strong {
      color: var(--ink-900);
      font-weight: 600;
    }

    td.mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .row-actions {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
    }

    .mini-ic {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-500);
      transition: all 0.12s ease;
    }

    .mini-ic:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg);
    }

    .mini-ic.danger:hover {
      border-color: var(--red-500);
      color: var(--red-600);
      background: var(--red-100);
    }

    /* ---------- Badges & Chips Limpios ---------- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2.5px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .badge-ok {
      background: var(--green-100);
      color: var(--green-600);
    }

    .badge-ok::before {
      background: var(--green-500);
    }

    .badge-warn {
      background: #FEF3C7;
      color: #92400E;
    }

    .badge-warn::before {
      background: #F59E0B;
    }

    .badge-off {
      background: var(--line-soft);
      color: var(--ink-500);
    }

    .badge-off::before {
      background: var(--ink-400);
    }

    .badge-bad {
      background: var(--red-100);
      color: var(--red-600);
    }

    .badge-bad::before {
      background: var(--red-500);
    }

    .badge-info {
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    .badge-info::before {
      background: var(--accent);
    }

    .chip {
      display: inline-block;
      font-size: 11px;
      padding: 2.5px 7px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink-700);
      margin: 1px 3px 1px 0;
      font-weight: 500;
      border: 1px solid var(--line);
    }

    .chip-orange {
      background: var(--accent-bg);
      color: var(--accent-hover);
      border-color: var(--accent-border);
      font-weight: 600;
    }

    .chip-danger {
      background: #FEE2E2;
      color: #991B1B;
      border-color: #FCA5A5;
      font-weight: 600;
    }

    .chip-warn {
      background: #FEF3C7;
      color: #92400E;
      border-color: #FDE68A;
      font-weight: 600;
    }

    .tab-nav {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-500);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--ink-900);
      background: var(--bg);
    }

    .tab-btn.active {
      color: var(--accent-hover);
      background: var(--accent-bg);
      border-color: var(--accent-border);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
      animation: fadeIn 0.15s ease;
    }

    .load-more-container {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      border-top: 1px solid var(--line);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: var(--ink-500);
      background: #FFFFFF;
    }

    .page-btns {
      display: flex;
      gap: 4px;
    }

    .page-btn {
      width: 25px;
      height: 25px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #FFFFFF;
      font-size: 11.5px;
      color: var(--ink-700);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn.active {
      background: var(--ink-900);
      color: #FFFFFF;
      border-color: var(--ink-900);
      font-weight: 700;
    }

    /* ---------- Forms & Inputs ---------- */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-900);
      margin-bottom: 5px;
      letter-spacing: -0.1px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      height: 38px;
      padding: 0 12px;
      font-size: 12.8px;
      outline: none;
      color: var(--ink-900);
      background: #FFFFFF;
      font-family: var(--body);
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field textarea {
      height: 76px;
      padding: 8px 12px;
      resize: vertical;
      line-height: 1.45;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      padding: 0 16px;
      background: #FFFFFF;
    }

    .tab {
      padding: 9px 8px;
      margin-right: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-500);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab:hover {
      color: var(--ink-900);
    }

    .tab.active {
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    /* ---------- Alerts ---------- */
    .alert {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.3px;
      align-items: flex-start;
    }

    .alert-warn {
      background: #FFFBEB;
      color: #92400E;
      border: 1px solid #FDE68A;
    }

    .alert-bad {
      background: var(--red-100);
      color: var(--red-600);
      border: 1px solid #FECACA;
    }

    .alert-info {
      background: var(--accent-bg);
      color: var(--accent-hover);
      border: 1px solid var(--accent-border);
    }

    .alert-ok {
      background: var(--green-100);
      color: var(--green-600);
      border: 1px solid #BBF7D0;
    }

    /* ---------- Map Mock ---------- */
    .map-mock {
      position: relative;
      height: 360px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #FAFAFA;
      border: 1px solid var(--line);
    }

    .map-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(24, 24, 27, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 24, 27, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .map-zone {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }

    .map-route {
      position: absolute;
      height: 3px;
      background: var(--accent);
      border-radius: 3px;
    }

    .map-pin {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .map-pin:hover {
      transform: rotate(-45deg) scale(1.25);
    }

    .map-legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      font-size: 11px;
      box-shadow: var(--shadow-sm);
    }

    .map-legend .li {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
    }

    .map-legend .li:first-child {
      margin-top: 0;
    }

    .map-legend .sw {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* ---------- Calendar Grid ---------- */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-dow {
      font-size: 11px;
      color: var(--ink-500);
      text-align: center;
      font-weight: 600;
      padding-bottom: 4px;
    }

    .cal-cell {
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      font-size: 11.5px;
      background: #FFFFFF;
      transition: border-color 0.15s ease;
    }

    .cal-cell:hover {
      border-color: var(--accent);
    }

    .cal-cell.off {
      background: var(--bg);
      color: var(--ink-400);
    }

    .cal-num {
      font-weight: 700;
      color: var(--ink-700);
      font-size: 11.5px;
    }

    .cal-tag {
      font-size: 9.5px;
      padding: 2px 5px;
      border-radius: 4px;
      margin-top: 4px;
      display: inline-block;
      font-weight: 600;
    }

    /* ---------- Toast & Modals ---------- */
    #toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 500;
    }

    .toast {
      background: var(--ink-900);
      color: #FFFFFF;
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      font-size: 12.8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 9px;
      animation: toastSlideIn 0.2s ease;
      border-left: 3px solid var(--accent);
    }

    @keyframes toastSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(43, 33, 24, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 600;
      padding: 20px;
      overflow-y: auto;
    }

    #modal-wrap.open {
      display: flex;
    }

    .modal-box {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(43, 33, 24, 0.22), 0 1px 3px rgba(43, 33, 24, 0.08);
      max-height: 88vh;
      overflow-y: auto;
      border: 1px solid var(--line);
      position: relative;
      animation: modalPopIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    @keyframes modalPopIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-box h3 {
      font-family: var(--display);
      font-size: 17.5px;
      margin-bottom: 6px;
      font-weight: 800;
      color: var(--ink-900);
      letter-spacing: -0.2px;
    }

    .modal-box p.modal-desc {
      font-size: 12.8px;
      color: var(--ink-500);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .modal-actions .btn {
      height: 36px;
      padding: 0 16px;
      font-size: 12.8px;
      font-weight: 600;
    }

    /* ---------- Login Screen ---------- */
    .login-wrap {
      min-height: 100vh;
      display: flex;
    }

    .login-side {
      flex: 1.1;
      background: #18181B;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      color: #FFFFFF;
    }

    .login-side .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.18), transparent 70%);
      top: -100px;
      right: -100px;
    }

    .login-form-side {
      width: 460px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      padding: 32px;
    }

    .login-card {
      width: 100%;
      max-width: 340px;
    }

    .login-quote {
      font-family: var(--display);
      font-size: 25px;
      font-weight: 800;
      line-height: 1.35;
      max-width: 440px;
      position: relative;
      z-index: 1;
      color: #FFFFFF;
    }

    .login-meta {
      font-size: 11.8px;
      color: var(--accent-border);
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 960px) {
      .login-side {
        display: none;
      }

      .login-form-side {
        width: 100%;
      }
    }

    .stepper {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .step-pill {
      font-size: 11.5px;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid var(--line);
      color: var(--ink-500);
      font-weight: 600;
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .step-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .svg-chart {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---------- Roles: Suiche de estado y Matriz de Permisos (Story Mapping HU ROLES) ---------- */
    .rol-toggle {
      width: 34px;
      height: 19px;
      border-radius: 12px;
      background: var(--line);
      border: 1px solid var(--line);
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 0 2px;
      transition: background 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
      vertical-align: middle;
    }

    .rol-toggle .thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease;
    }

    .rol-toggle.on {
      background: var(--green-500);
      border-color: var(--green-500);
    }

    .rol-toggle.on .thumb {
      transform: translateX(15px);
    }

    .rol-toggle-txt {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-500);
      margin-left: 6px;
    }

    .perm-matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .perm-matrix th {
      background: var(--bg);
      color: var(--ink-500);
      font-weight: 600;
      font-size: 10.8px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
    }

    .perm-matrix td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--line-soft);
      text-align: center;
    }

    .perm-matrix td:first-child {
      text-align: left;
    }

    .perm-matrix .perm-area {
      background: var(--line-soft);
      font-weight: 700;
      color: var(--ink-700);
      font-size: 11px;
      text-align: left;
      padding: 7px 10px;
    }

    .perm-check {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      vertical-align: middle;
    }

    /* ==========================================================================
       RESPONSIVE & ADAPTIVE STYLES (Mobile, Tablet, Desktop, Ultra-wide)
       ========================================================================== */

    /* Backdrop for Mobile Sidebar Drawer */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(43, 33, 24, 0.65);
      backdrop-filter: blur(3px);
      z-index: 998;
      opacity: 0;
      transition: opacity 0.25s ease;
      cursor: pointer;
    }

    #sidebar-backdrop.active {
      display: block;
      opacity: 1;
    }

    /* Horizontal scroll container for all tables */
    .panel {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .panel table {
      min-width: 620px;
    }

    .panel.no-min-width table,
    .cal-grid table,
    .perm-matrix {
      min-width: unset;
    }

    /* Custom smooth scrollbars */
    .panel::-webkit-scrollbar,
    #map-svg-viewport::-webkit-scrollbar,
    .inline-filter-values-grid::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }

    .panel::-webkit-scrollbar-track,
    #map-svg-viewport::-webkit-scrollbar-track {
      background: var(--bg);
    }

    .panel::-webkit-scrollbar-thumb,
    #map-svg-viewport::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }

    .panel::-webkit-scrollbar-thumb:hover {
      background: var(--ink-400);
    }

    /* Form layout helper in modals */
    .modal-box .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* -------------------------------------------------------------
       BREAKPOINT: Large Tablets & Small Laptops (<= 1100px)
       ------------------------------------------------------------- */
    @media (max-width: 1100px) {
      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .hub-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .metric-pills-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* -------------------------------------------------------------
       BREAKPOINT: Tablets & Stacked Layouts (<= 1024px)
       ------------------------------------------------------------- */
    @media (max-width: 1024px) {
      .grid-2-uneven {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      #dom-inspector-panel,
      #sub-inspector-panel,
      #monitoreo-inspector-panel,
      .panel[style*="sticky"] {
        position: static !important;
        top: auto !important;
      }
    }

    /* -------------------------------------------------------------
       BREAKPOINT: Mobile & Off-Canvas Navigation (<= 992px)
       ------------------------------------------------------------- */
    @media (max-width: 992px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px !important;
        height: 100vh;
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 999;
        box-shadow: 4px 0 24px rgba(43, 33, 24, 0.35);
      }

      #sidebar.mobile-open {
        transform: translateX(0);
      }

      #sidebar.collapsed {
        transform: translateX(-100%);
        width: 280px !important;
      }

      #sidebar.mobile-open .brand-text,
      #sidebar.mobile-open .macro-label,
      #sidebar.mobile-open .macro-count,
      #sidebar.mobile-open .macro-chev,
      #sidebar.mobile-open .nav-demo-box,
      #sidebar.mobile-open .nav-footer {
        display: flex !important;
      }

      #sidebar.mobile-open .brand-text {
        display: block !important;
      }

      #sidebar.mobile-open .macro-btn {
        justify-content: flex-start !important;
        padding: 8px 10px !important;
      }

      #main {
        width: 100%;
        min-width: 0;
      }

      #content {
        padding: 16px 16px 36px 16px;
      }

      .topbar-search {
        max-width: 240px;
      }
    }

    /* -------------------------------------------------------------

        justify-content: center;
      }

        grid-template-columns: 1fr;
        gap: 12px;
      }

      .modal-box .grid-2 {

      }

        min-height: 380px !important;
        height: 380px !important;
      }
    }

       ------------------------------------------------------------- */
    @media (max-width: 640px) {

        padding: 12px 10px 30px 10px;
      }

      .topbar-search {
        display: none;
      }

      .grid-3 {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .hub-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .metric-pills-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .chart-body-wrap {
        padding: 14px 12px;
      }

      .chart-summary-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .chart-big-number {
        font-size: 22px;
      }

      .chart-meta-details {
        flex-direction: column;
        gap: 4px;
      }

      .analytics-head {
        padding: 10px 12px;
        flex-direction: column;
        align-items: flex-start;
      }

      .time-filter-row {
        width: 100%;
        justify-content: space-between;
      }

      .time-btn {
        flex: 1;
        text-align: center;
        padding: 4px 6px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar .select,
      .toolbar .btn {
        width: 100%;
        justify-content: center;
      }

      .pagination {
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        text-align: center;
      }

      .pagination .page-btns {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .btn-load-more {
        width: 100%;
        justify-content: center;
      }

      .modal-box {
        width: 96vw !important;
        padding: 14px !important;
        margin: 8px !important;
      }

      .modal-actions {
        flex-direction: column-reverse;
        gap: 8px;
      }

      .modal-actions .btn {
        width: 100%;
        justify-content: center;
      }

      .login-wrap {
        flex-direction: column;
      }

      .login-side {
        display: none;
      }

      .login-form-side {
        width: 100%;
        padding: 20px 16px;
      }

      .login-card {
        padding: 20px 16px;
        max-width: 100%;
      }
    }

    /* -------------------------------------------------------------
       BREAKPOINT: Extra Small Devices (<= 400px)
       ------------------------------------------------------------- */
    @media (max-width: 400px) {
      .metric-pills-row {
        grid-template-columns: 1fr;
      }

      .metric-pill {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .metric-pill:last-child {
        border-bottom: none;
      }
    }

</head>
