<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Coca de Jacks — Almuerzos caseros por suscripción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange-700:#C2410C;
  --orange-600:#EA580C;
  --orange-500:#F1793D;
  --orange-100:#FDEAD9;
  --orange-50:#FEF5EC;
  --gold-600:#C6890A;
  --gold-100:#FBF0D8;
  --green-600:#3E8A63;
  --green-100:#E7F3EC;
  --red-600:#C0392B;
  --red-100:#FBE7E4;
  --blue-600:#2F5F8A;
  --blue-100:#E1EAF3;
  --ink-900:#241C16;
  --ink-700:#57493E;
  --ink-500:#8C7B6C;
  --ink-300:#CBBEAE;
  --line:#EFE4D6;
  --line-soft:#F7F0E6;
  --bg:#FAF7F2;
  --card:#FFFFFF;
  --radius:16px;
  --radius-sm:10px;
  --shadow-sm:0 1px 3px rgba(90,60,20,.07);
  --shadow-md:0 12px 28px rgba(90,60,20,.10);
  --mono:'JetBrains Mono',monospace;
  --display:'Manrope',sans-serif;
  --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink-900);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;}
h1,h2,h3,h4{font-family:var(--display);margin:0;color:var(--ink-900);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--body);cursor:pointer;}
img{max-width:100%;display:block;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
#site-header .wrap{max-width:none;width:100%;margin:0;padding:0 28px;}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange-600);font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;font-size:14px;font-weight:700;padding:12px 20px;border:1.5px solid transparent;white-space:nowrap;font-family:var(--body);}
.btn-primary{background:var(--orange-600);color:#fff;box-shadow:0 8px 18px rgba(234,88,12,.28);}
.btn-primary:hover{background:var(--orange-700);}
.btn-ghost{background:#fff;color:var(--ink-900);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-300);}
.btn-outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.55);}
.btn-outline-light:hover{background:rgba(255,255,255,.12);}
.btn-sm{padding:9px 14px;font-size:12.6px;}
.btn-block{width:100%;justify-content:center;}
.pill-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;}
.section{padding:86px 0;}
.section-head{max-width:600px;margin:0 auto 46px auto;text-align:center;}
.section-head h2{font-size:32px;letter-spacing:-.4px;margin-top:10px;}
.section-head p{color:var(--ink-500);margin-top:12px;font-size:15px;}
.card-surface{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#E6D8C6;border-radius:6px;}

/* ---------- Header ---------- */
#site-header{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:26px;height:76px;}
.logo{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--orange-500),var(--orange-700));display:flex;align-items:center;justify-content:center;font-size:19px;}
.logo-text{font-family:var(--display);font-weight:800;font-size:16.5px;line-height:1.15;}
.logo-text .sub{display:block;font-size:9.5px;color:var(--ink-500);font-family:var(--mono);letter-spacing:.6px;text-transform:uppercase;font-weight:500;}
.main-nav{display:flex;align-items:center;justify-content:center;gap:26px;flex:1 1 auto;min-width:0;}
.main-nav a{font-size:13.6px;font-weight:600;color:var(--ink-700);white-space:nowrap;}
.main-nav a:hover{color:var(--orange-600);}
.header-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.link-btn{font-size:13.4px;font-weight:700;color:var(--ink-700);padding:8px 6px;}
.link-btn:hover{color:var(--orange-600);}
@media(max-width:980px){.main-nav{display:none;}}

/* ---------- Hero ---------- */
#hero{padding:64px 0 90px 0;position:relative;overflow:hidden;}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;}
.hero-title{font-size:46px;line-height:1.09;letter-spacing:-1px;margin:16px 0 18px 0;}
.hero-title em{font-style:normal;color:var(--orange-600);}
.hero-sub{font-size:16px;color:var(--ink-500);max-width:480px;line-height:1.6;}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;}
.trust-row{display:flex;gap:26px;margin-top:38px;flex-wrap:wrap;}
.trust-item .n{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--ink-900);}
.trust-item .l{font-size:11.5px;color:var(--ink-500);font-weight:600;}

.hero-visual{position:relative;height:460px;}
.hero-blob{position:absolute;inset:20px;border-radius:44% 56% 60% 40% / 48% 42% 58% 52%;background:linear-gradient(150deg,var(--orange-100),var(--gold-100) 60%,#fff);border:1px solid var(--line);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;}
.hero-plate{font-size:150px;filter:drop-shadow(0 18px 30px rgba(120,70,20,.18));}
.float-card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-md);padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12px;}
.float-card .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.float-card .t{font-weight:700;color:var(--ink-900);}
.float-card .s{color:var(--ink-500);font-size:10.8px;}
.fc1{top:12px;left:-10px;}
.fc2{bottom:30px;right:-16px;}
.fc3{top:52%;left:-30px;}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;}.hero-visual{margin-top:20px;height:340px;}.hero-title{font-size:34px;}}

/* ---------- Plans ---------- */
#planes{background:#fff;}
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.plan-card{padding:28px;position:relative;}
.plan-card.featured{border-color:var(--orange-500);box-shadow:0 0 0 3px var(--orange-100),var(--shadow-md);}
.plan-badge{position:absolute;top:-13px;left:28px;background:var(--orange-600);color:#fff;font-size:10.8px;font-weight:800;padding:5px 12px;border-radius:20px;letter-spacing:.3px;}
.plan-name{font-size:16px;font-weight:800;}
.plan-price{font-family:var(--mono);font-weight:800;font-size:32px;margin:14px 0 2px 0;}
.plan-price span{font-size:13px;color:var(--ink-500);font-weight:500;font-family:var(--body);}
.plan-count{font-size:12.6px;color:var(--orange-600);font-weight:700;margin-bottom:18px;}
.plan-list{list-style:none;padding:0;margin:0 0 22px 0;display:flex;flex-direction:column;gap:11px;}
.plan-list li{display:flex;gap:9px;font-size:13px;color:var(--ink-700);align-items:flex-start;}
.plan-list li svg{flex-shrink:0;margin-top:2px;color:var(--green-600);}
@media(max-width:900px){.plans-grid{grid-template-columns:1fr;}}

/* ---------- Como funciona ---------- */
.steps-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
.step-card{padding:22px 16px;text-align:left;}
.step-num{font-family:var(--mono);font-size:11px;color:var(--orange-600);font-weight:700;}
.step-ic{width:42px;height:42px;border-radius:11px;background:var(--orange-100);color:var(--orange-600);display:flex;align-items:center;justify-content:center;margin:12px 0 12px 0;}
.step-card h4{font-size:13.5px;margin-bottom:6px;}
.step-card p{font-size:12px;color:var(--ink-500);line-height:1.5;}
@media(max-width:980px){.steps-row{grid-template-columns:repeat(3,1fr);}}
@media(max-width:620px){.steps-row{grid-template-columns:repeat(2,1fr);}}

/* ---------- Menus ---------- */
#menus{background:#fff;}
.menu-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.menu-card{overflow:hidden;}
.menu-photo{height:130px;display:flex;align-items:center;justify-content:center;font-size:52px;}
.menu-body{padding:14px 15px 16px 15px;}
.menu-day{font-family:var(--mono);font-size:10.3px;color:var(--orange-600);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.menu-body h4{font-size:13.6px;margin:5px 0 6px 0;}
.menu-body p{font-size:11.6px;color:var(--ink-500);line-height:1.45;}
@media(max-width:980px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:620px){.menu-grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- Cobertura ---------- */
.cover-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;}
.cover-map{height:380px;border-radius:var(--radius);position:relative;overflow:hidden;background:linear-gradient(135deg,#F5EEE2,#FBF3E7);border:1px solid var(--line);}
.cover-grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(194,65,12,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(194,65,12,.05) 1px,transparent 1px);background-size:30px 30px;}
.zone-blob{position:absolute;border-radius:50%;opacity:.22;}
.zone-pin{position:absolute;width:13px;height:13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.18);}
.zone-list{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
.zone-item{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border:1px solid var(--line);border-radius:11px;background:#fff;}
.zone-item .n{font-size:13px;font-weight:700;}
@media(max-width:900px){.cover-grid{grid-template-columns:1fr;}}

/* ---------- Beneficios ---------- */
#beneficios{background:#fff;}
.benefit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.benefit-card{padding:24px 18px;text-align:center;}
.benefit-ic{width:46px;height:46px;border-radius:13px;background:var(--gold-100);color:var(--gold-600);display:flex;align-items:center;justify-content:center;margin:0 auto 14px auto;}
.benefit-card h4{font-size:13.4px;margin-bottom:6px;}
.benefit-card p{font-size:11.6px;color:var(--ink-500);line-height:1.5;}
@media(max-width:980px){.benefit-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:620px){.benefit-grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- Testimonios ---------- */
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.testi-card{padding:24px;}
.stars{color:var(--gold-600);font-size:13px;letter-spacing:2px;margin-bottom:12px;}
.testi-card p{font-size:13.4px;color:var(--ink-700);line-height:1.65;}
.testi-who{display:flex;align-items:center;gap:10px;margin-top:18px;}
.testi-avatar{width:38px;height:38px;border-radius:50%;background:var(--orange-100);color:var(--orange-700);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:13px;}
.testi-name{font-size:12.6px;font-weight:700;}
.testi-plan{font-size:10.8px;color:var(--ink-500);font-family:var(--mono);}
@media(max-width:900px){.testi-grid{grid-template-columns:1fr;}}

/* ---------- FAQ ---------- */
#faq{background:#fff;}
.faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.faq-item{border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.faq-q{width:100%;text-align:left;background:#fff;border:none;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--ink-900);}
.faq-chev{transition:transform .18s ease;color:var(--orange-600);flex-shrink:0;}
.faq-item.open .faq-chev{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .2s ease;}
.faq-item.open .faq-a{max-height:200px;}
.faq-a-inner{padding:0 20px 18px 20px;font-size:13.2px;color:var(--ink-500);line-height:1.6;}

/* ---------- CTA band ---------- */
.cta-band{background:linear-gradient(120deg,var(--orange-700),var(--orange-500));border-radius:24px;padding:52px 46px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;color:#fff;}
.cta-band h3{font-size:26px;max-width:460px;color:#fff;}
.cta-band p{color:rgba(255,255,255,.85);margin-top:8px;font-size:13.6px;max-width:440px;}

/* ---------- Footer ---------- */
#site-footer{background:var(--ink-900);color:#DCD1C4;padding:64px 0 26px 0;}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px;}
.footer-brand .logo-text{color:#fff;}
.footer-brand p{font-size:12.8px;color:#B7A997;margin-top:14px;line-height:1.6;max-width:280px;}
.footer-col h5{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#fff;font-family:var(--mono);margin-bottom:16px;}
.footer-col a,.footer-col p{display:block;font-size:12.8px;color:#B7A997;margin-bottom:10px;}
.footer-col a:hover{color:#fff;}
.social-row{display:flex;gap:10px;margin-top:16px;}
.social-ic{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff;}
.footer-bottom{margin-top:50px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;font-size:11.6px;color:#8A7B68;flex-wrap:wrap;gap:10px;}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* =========================================================
   AUTH SCREENS (login / register) — client, orange theme
   ========================================================= */
.auth-wrap{min-height:100vh;display:flex;}
.auth-side{flex:1;background:linear-gradient(160deg,var(--orange-700),var(--orange-500) 130%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:44px;color:#fff;}
.auth-side .glow{position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);bottom:-140px;left:-120px;}
.auth-quote{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.3;max-width:400px;position:relative;z-index:1;}
.auth-meta{font-size:12px;color:#FCE3CD;font-family:var(--mono);position:relative;z-index:1;}
.auth-form-side{width:460px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;overflow-y:auto;padding:40px 0;}
.auth-card{width:340px;}
@media(max-width:900px){.auth-side{display:none;}.auth-form-side{width:100%;}}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-700);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;height:38px;padding:0 12px;font-size:13.4px;outline:none;color:var(--ink-900);background:#fff;font-family:var(--body);}
.field textarea{height:72px;padding:9px 12px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange-500);box-shadow:0 0 0 3px var(--orange-100);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.radio-row{display:flex;gap:10px;}
.radio-opt{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.6px;font-weight:600;display:flex;align-items:center;gap:8px;}
.radio-opt.sel{border-color:var(--orange-500);background:var(--orange-50);color:var(--orange-700);}

/* =========================================================
   CLIENT PORTAL SHELL — distinct from admin BackOffice
   ========================================================= */
#portal-app{display:flex;min-height:100vh;background:var(--bg);}
#p-sidebar{width:250px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;}
.p-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px 20px;}
.p-nav{padding:8px 14px;flex:1;}
.p-nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:none;background:transparent;border-radius:11px;color:var(--ink-700);font-size:13.3px;font-weight:600;text-align:left;margin-bottom:3px;}
.p-nav-item:hover{background:var(--orange-50);}
.p-nav-item.active{background:var(--orange-600);color:#fff;box-shadow:0 6px 14px rgba(234,88,12,.28);}
.p-nav-item .ic-wrap{width:20px;display:flex;justify-content:center;flex-shrink:0;}
.p-sidebar-foot{padding:16px 20px;border-top:1px solid var(--line-soft);}
.p-help-card{background:var(--orange-50);border-radius:13px;padding:14px;font-size:11.8px;color:var(--ink-700);}
.p-help-card b{display:block;margin-bottom:4px;font-size:12.6px;}

#p-main{flex:1;min-width:0;}
#p-topbar{height:70px;background:transparent;display:flex;align-items:center;padding:0 34px;gap:16px;}
.p-title-block{flex:1;}
.p-title-block h2{font-size:19px;}
.p-title-block .sub{font-size:12.4px;color:var(--ink-500);margin-top:2px;}
.p-avatar{width:38px;height:38px;border-radius:50%;background:var(--orange-100);color:var(--orange-700);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:13.5px;}
.p-icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-700);position:relative;}
#p-content{padding:6px 34px 60px 34px;}

.p-hero-card{background:linear-gradient(120deg,var(--orange-600),var(--orange-500));border-radius:20px;padding:28px 30px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.p-hero-card h3{color:#fff;font-size:21px;}
.p-hero-card p{color:rgba(255,255,255,.88);font-size:13px;margin-top:6px;max-width:420px;}
.p-hero-emoji{font-size:64px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.15));}

.p-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.p-kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 19px;}
.p-kpi .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.p-kpi .lbl{font-size:11.6px;color:var(--ink-500);font-weight:600;}
.p-kpi .val{font-family:var(--mono);font-weight:700;font-size:21px;margin-top:4px;}

.p-panel{background:#fff;border:1px solid var(--line);border-radius:16px;}
.p-panel-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.p-panel-head h3{font-size:15px;}
.p-panel-body{padding:20px 22px;}
.p-grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start;}
@media(max-width:980px){.p-grid-2{grid-template-columns:1fr;}}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;}
.badge-ok{background:var(--green-100);color:var(--green-600);}.badge-ok::before{background:var(--green-600);}
.badge-warn{background:var(--gold-100);color:var(--gold-600);}.badge-warn::before{background:var(--gold-600);}
.badge-off{background:#F0EBE3;color:var(--ink-500);}.badge-off::before{background:var(--ink-300);}
.badge-bad{background:var(--red-100);color:var(--red-600);}.badge-bad::before{background:var(--red-600);}
.badge-info{background:var(--blue-100);color:var(--blue-600);}.badge-info::before{background:var(--blue-600);}

.p-timeline{display:flex;justify-content:space-between;position:relative;padding:10px 6px 0 6px;}
.p-timeline::before{content:"";position:absolute;top:31px;left:36px;right:36px;height:3px;background:var(--line);border-radius:3px;}
.p-timeline .fill{position:absolute;top:31px;left:36px;height:3px;background:var(--orange-600);border-radius:3px;z-index:1;}
.tl-step{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
.tl-dot{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-300);}
.tl-step.done .tl-dot{border-color:var(--orange-600);background:var(--orange-600);color:#fff;}
.tl-step.current .tl-dot{border-color:var(--orange-600);color:var(--orange-600);box-shadow:0 0 0 5px var(--orange-100);}
.tl-step .t{font-size:12px;font-weight:700;color:var(--ink-700);text-align:center;}
.tl-step .s{font-size:10.6px;color:var(--ink-300);font-family:var(--mono);}

table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:10.6px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-300);font-family:var(--mono);font-weight:500;padding:11px 4px;border-bottom:1px solid var(--line);}
tbody td{padding:13px 4px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-700);}
tbody tr:last-child td{border:none;}
td.strong{color:var(--ink-900);font-weight:700;}
td.mono{font-family:var(--mono);font-size:12.3px;}

.p-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.p-cal-dow{font-size:10px;color:var(--ink-300);text-transform:uppercase;text-align:center;font-family:var(--mono);padding-bottom:3px;}
.p-cal-cell{aspect-ratio:1;border:1.5px solid var(--line-soft);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink-700);background:#fff;}
.p-cal-cell.off{color:var(--ink-300);border-color:transparent;}
.p-cal-cell.sel{background:var(--orange-600);border-color:var(--orange-600);color:#fff;}
.p-cal-cell:not(.off):hover{border-color:var(--orange-500);cursor:pointer;}

.upload-box{border:1.5px dashed var(--line);border-radius:13px;padding:26px;text-align:center;color:var(--ink-500);font-size:12.6px;}
.thumb-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.thumb{width:56px;height:56px;border-radius:9px;background:var(--orange-50);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line);}

.chip-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:16px;background:var(--orange-50);color:var(--orange-700);margin:2px 4px 2px 0;}
.chip-tag button{border:none;background:transparent;color:inherit;font-size:12px;padding:0;line-height:1;}

.map-mock{position:relative;height:280px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#F5EEE2,#FBF3E7);border:1px solid var(--line);}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(194,65,12,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(194,65,12,.05) 1px,transparent 1px);background-size:28px 28px;}
.map-route-line{position:absolute;height:3px;background:var(--orange-500);border-radius:3px;}
.map-pin{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.map-eta{position:absolute;top:14px;left:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;box-shadow:var(--shadow-sm);font-size:12px;}

#toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--ink-900);color:#fff;padding:12px 16px;border-radius:11px;font-size:12.8px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:9px;animation:slidein .18s ease;}
@keyframes slidein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
#modal-wrap{position:fixed;inset:0;background:rgba(36,28,22,.45);display:none;align-items:center;justify-content:center;z-index:300;}
#modal-wrap.open{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:380px;box-shadow:var(--shadow-md);}
.modal-box h3{font-size:16px;margin-bottom:8px;}
.modal-box p{font-size:12.8px;color:var(--ink-500);line-height:1.55;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
</style>
</head>

    leaf:'<path d="M4 20c8 0 15-6 15-16C9 4 4 12 4 20Z"/><path d="M4 20c3-6 7-9 15-16"/>',

function toast(msg){
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');t.className='toast';t.innerHTML=ic('check',15)+'<span>'+msg+'</span>';
  w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s';setTimeout(()=>t.remove(),250);},2600);
}
function openModal(title,body,confirmLabel,onConfirm,confirmColor){
  const w=document.getElementById('modal-wrap');
  document.getElementById('modal-box').innerHTML='<h3>'+title+'</h3><p>'+body+'</p>'+
    '<div class="modal-actions"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button>'+
    '<button class="btn btn-primary" id="modal-ok" style="background:'+(confirmColor||'var(--orange-600)')+'">'+confirmLabel+'</button></div>';
  w.classList.add('open');
  document.getElementById('modal-cancel').onclick=()=>w.classList.remove('open');
  document.getElementById('modal-ok').onclick=()=>{w.classList.remove('open');if(onConfirm)onConfirm();};
}
document.getElementById('modal-wrap').addEventListener('click',e=>{if(e.target.id==='modal-wrap')e.currentTarget.classList.remove('open');});
function badge(status){
  const map={'Activa':'badge-ok','Activo':'badge-ok','Entregado':'badge-ok','Al día':'badge-ok','Resuelto':'badge-ok',
    'Pendiente':'badge-warn','En revisión':'badge-warn','Empacado':'badge-warn',
    'En preparación':'badge-info','En ruta':'badge-info',
    'Vencida':'badge-bad','Cancelada':'badge-bad','Rechazado':'badge-bad'};
  return '<span class="badge '+(map[status]||'badge-off')+'">'+status+'</span>';
}

function wireLanding(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',e=>{e.preventDefault();
      if(el.dataset.go==='login')renderLogin();
      if(el.dataset.go==='register')renderRegister();

  });
  document.querySelectorAll('.faq-q').forEach(q=>{

  document.querySelectorAll('[data-ptoast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.ptoast)));

  }));

  if(susBtn)susBtn.addEventListener('click',()=>openModal('¿Suspender esta entrega?','No recibirás almuerzo el día seleccionado. Podrás reactivar tu servicio automáticamente al día siguiente.','Sí, suspender',()=>toast('Entrega suspendida correctamente')));

  if(incForm)incForm.addEventListener('click',()=>toast('Tu incidencia fue reportada. Te avisaremos por correo cuando sea resuelta.'));

}

PR['suspender']=function(){
  let h='<div class="p-grid-2">';
  h+='<div class="p-panel"><div class="p-panel-head"><h3>Selecciona el día a suspender</h3></div><div class="p-panel-body">';
  h+='<div class="p-cal-grid">';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d=>h+='<div class="p-cal-dow">'+d+'</div>');
  const days=[{n:'',off:true},{n:'',off:true},{n:'',off:true},{n:'',off:true},{n:'',off:true},{n:1},{n:'',off:true},
    {n:3},{n:4},{n:5,disabled:true},{n:6},{n:7,sel:true},{n:8,off:true},{n:'',off:true},
    {n:10},{n:11},{n:12},{n:13},{n:14},{n:15,off:true},{n:'',off:true}];
  days.forEach(d=>{
    h+='<div class="p-cal-cell'+(d.off?' off':'')+(d.sel?' sel':'')+'"'+(!d.off&&d.n?' data-cal':'')+'>'+d.n+'</div>';
  });
  h+='</div>';
  h+='<div class="field" style="margin-top:20px"><label>Motivo (opcional)</label><textarea placeholder="Cuéntanos por qué deseas suspender esta entrega…"></textarea></div>';
  h+='<button class="btn btn-primary" id="confirm-suspend" style="margin-top:4px">Confirmar suspensión</button>';
  h+='</div></div>';
  h+='<div class="p-panel"><div class="p-panel-head"><h3>Tus suspensiones</h3></div><div class="p-panel-body">'+
     '<div style="display:flex;flex-direction:column;gap:12px">'+

     '</div><div class="alert" style="background:var(--gold-100);color:#7A5A0C;margin-top:16px;padding:12px 14px;border-radius:11px;font-size:12.2px">Te quedan <b>1 suspensión</b> disponible este mes según tu plan.</div></div></div>';
  h+='</div>';
  return h;
};
function susItem(date,status){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border:1px solid var(--line-soft);border-radius:10px"><span style="font-size:12.8px;font-weight:600" class="mono">'+date+'</span>'+badge(status==='Aplicada'?'Activo':'Pendiente')+'</div>';}
